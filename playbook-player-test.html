/* assets/css/tokens.css */
/*
 * Design tokens – Stage 0 interface style draft (spec v3, 3.4).
 * Two themes:
 *   data-theme="club"    club edition (Coaches App): black and gold,
 *                        taken from the club logo colours. Logo itself is
 *                        added in Stage 6 with the club's permission.
 *   data-theme="neutral" Club-neutral (Players App, decision U6).
 * Every text/background pair used by components is checked for WCAG 2.2 AA
 * contrast by tests/stage0.test.mjs.
 */
:root {
  /* Typography: system fonts only (decision D13). */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --fs-xs: 0.75rem;   /* 12px – captions only */
  --fs-sm: 0.875rem;  /* 14px – secondary text */
  --fs-md: 1rem;      /* 16px – body; also prevents iOS zoom on inputs */
  --fs-lg: 1.125rem;  /* 18px – emphasised body, Players App notes */
  --fs-xl: 1.375rem;  /* 22px – section titles */
  --fs-2xl: 1.75rem;  /* 28px – screen titles */
  --lh-tight: 1.2;
  --lh-body: 1.5;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-bold: 700;

  /* Spacing: 4 px base scale. */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;

  /* Shape. */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;
  --shadow-1: 0 1px 2px rgba(20, 20, 25, 0.08), 0 1px 1px rgba(20, 20, 25, 0.04);
  --shadow-2: 0 4px 12px rgba(20, 20, 25, 0.12);

  /* Touch targets: 44 px minimum everywhere, 48 px preferred on phones. */
  --touch-min: 44px;
  --touch-comfort: 48px;
  --icon-size: 20px;

  /* Layout. */
  --content-max: 1200px;
  --bp-tablet: 600px;   /* reference only; media queries use literal values */
  --bp-desktop: 1024px;

  /* Status colours (shared by both themes). */
  --c-success: #1e7a44;
  --c-success-bg: #e6f4ec;
  --c-warning: #7a4f00;
  --c-warning-bg: #fff4d6;
  --c-danger: #b42318;
  --c-danger-bg: #fdecea;
  --c-info: #1d5fa8;
  --c-info-bg: #e8f1fb;
  --c-focus: #0b63ce;

  /* Provenance badges for Coach Resources (spec v3, 9.3). */
  --c-prov-manual: #1e5a3a;
  --c-prov-manual-bg: #e3f2e9;
  --c-prov-pending: #6b4a00;
  --c-prov-pending-bg: #fff1cc;
  --c-prov-supp: #3f3f9a;
  --c-prov-supp-bg: #ececfb;

  /* Court drawing (used from Stage 2). */
  --c-court: #ecd9b8;
  --c-court-line: #ffffff;
  --c-court-key: #e0c69a;
  --c-defence: #475569;
}

[data-theme="club"] {
  --c-bg: #f6f5f2;
  --c-surface: #ffffff;
  --c-surface-2: #efede7;
  --c-border: #d9d5cb;        /* decorative dividers and card edges */
  --c-border-control: #858071; /* outlines that identify controls: 3:1 or more (WCAG 1.4.11) */
  --c-text: #17171a;
  --c-text-2: #3d3d45;
  --c-muted: #62626b;
  --c-brand: #17171a;        /* club black */
  --c-on-brand: #f4c766;     /* club gold on black */
  --c-accent: #f2c14e;       /* gold fill; text on it uses --c-on-accent */
  --c-on-accent: #17171a;
  --c-accent-strong: #7d5a0c; /* gold-brown for links and outlines on white */
  --c-attack: #17171a;
  --c-attack-text: #f4c766;
}

[data-theme="neutral"] {
  --c-bg: #f4f6f9;
  --c-surface: #ffffff;
  --c-surface-2: #e9edf3;
  --c-border: #d3dae4;        /* decorative dividers and card edges */
  --c-border-control: #768092; /* outlines that identify controls: 3:1 or more (WCAG 1.4.11) */
  --c-text: #15202e;
  --c-text-2: #34404f;
  --c-muted: #5b6676;
  --c-brand: #1e3a5f;        /* navy */
  --c-on-brand: #ffffff;
  --c-accent: #2563c9;       /* blue */
  --c-on-accent: #ffffff;
  --c-accent-strong: #1d4fa0;
  --c-attack: #1e3a5f;
  --c-attack-text: #ffffff;
}

/*
 * Players App themes (Stage 3, approved design): restrained charcoal and amber, replacing the
 * earlier navy and blue proposal for the Players App. Dark is the default; light is adjusted for
 * contrast rather than inverted (amber stays a fill with dark text; amber text and outlines on
 * light surfaces use a darker amber). The court keeps the same colours in both themes. Every
 * pair below is checked for WCAG 2.2 AA by tests/stage0.test.mjs (T21).
 */
[data-theme="player-dark"] {
  --c-bg: #10141c;
  --c-surface: #202733;
  --c-surface-2: #171d27;     /* navigation and secondary surfaces */
  --c-border: #39414f;        /* dividers and card edges */
  --c-border-control: #7a8494; /* outlines that identify controls: 3:1 or more */
  --c-text: #f4f6f9;
  --c-text-2: #d6dce4;
  --c-muted: #aab4c2;
  --c-brand: #171d27;
  --c-on-brand: #f4f6f9;
  --c-accent: #edb34e;        /* amber fill; text on it uses --c-on-accent */
  --c-on-accent: #10141c;
  --c-accent-strong: #edb34e; /* amber text and outlines on the dark surfaces */
  --c-attack: #19212e;
  --c-attack-text: #ffffff;
  --c-focus: #f2c46d;
  --c-success: #8fdcaa;
  --c-success-bg: #14291c;
  --c-warning: #f2c46d;
  --c-warning-bg: #2e2412;
  --c-danger: #ff9b91;
  --c-danger-bg: #3a1a18;
  --c-info: #9cc7ff;
  --c-info-bg: #14243a;
  --c-court: #e4c9a3;
  --c-court-key: #d5b58b;
  --c-court-line: #ffffff;
  --c-defence: #a83232;
}

[data-theme="player-light"] {
  --c-bg: #f3f4f6;
  --c-surface: #ffffff;
  --c-surface-2: #e8ebf0;
  --c-border: #d4d9e1;
  --c-border-control: #737c8b;
  --c-text: #121722;
  --c-text-2: #2f3846;
  --c-muted: #525d6d;
  --c-brand: #1c2433;
  --c-on-brand: #ffffff;
  --c-accent: #edb34e;
  --c-on-accent: #10141c;
  --c-accent-strong: #875700; /* darker amber: 4.5:1 or more on the light surfaces */
  --c-attack: #19212e;
  --c-attack-text: #ffffff;
  --c-focus: #875700;
  --c-court: #e4c9a3;
  --c-court-key: #d5b58b;
  --c-court-line: #ffffff;
  --c-defence: #a83232;
}

/* assets/css/base.css */
/* Base element styles – Stage 0. */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: var(--lh-body);
  color: var(--c-text);
  background: var(--c-bg);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { line-height: var(--lh-tight); margin: 0 0 var(--s-3); }
h1 { font-size: var(--fs-2xl); font-weight: var(--fw-bold); }
h2 { font-size: var(--fs-xl); font-weight: var(--fw-bold); }
h3 { font-size: var(--fs-lg); font-weight: var(--fw-medium); }
p { margin: 0 0 var(--s-3); }
small, .text-sm { font-size: var(--fs-sm); }
.muted { color: var(--c-muted); }
code, pre, .mono { font-family: var(--font-mono); font-size: 0.9em; }
pre { white-space: pre-wrap; word-break: break-word; }
.num { font-variant-numeric: tabular-nums; }

a { color: var(--c-accent-strong); text-underline-offset: 2px; }

:focus-visible {
  outline: 3px solid var(--c-focus);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap;
}

.noscript { padding: var(--s-5); font-size: var(--fs-lg); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* assets/css/components.css */
/* Component styles – Stage 0 style draft. Final layouts follow mock-up approval. */

/* App frame ---------------------------------------------------------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.app-main {
  flex: 1;
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--s-4);
}
@media (min-width: 600px) { .app-main { padding: var(--s-5); } }

/* Header ------------------------------------------------------------- */
.app-header {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-height: 56px;
  padding: 0 var(--s-4);
  background: var(--c-brand);
  color: var(--c-on-brand);
  padding-top: env(safe-area-inset-top);
}
.app-header .title { font-size: var(--fs-lg); font-weight: var(--fw-bold); margin: 0; }
.app-header .subtitle { font-size: var(--fs-sm); opacity: 0.85; }
.app-header .spacer { flex: 1; }
.club-mark {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c-accent); color: var(--c-on-accent);
  font-weight: var(--fw-bold); font-size: var(--fs-sm);
}

/* Top navigation (Coaches App: tablet and desktop first) -------------- */
.nav-top {
  display: flex;
  gap: var(--s-1);
  padding: 0 var(--s-3);
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  overflow-x: auto;
}
.nav-top button {
  display: inline-flex; align-items: center; gap: var(--s-2);
  min-height: var(--touch-min);
  padding: 0 var(--s-4);
  border: 0; border-bottom: 3px solid transparent;
  background: none; color: var(--c-text-2);
  font: inherit; font-weight: var(--fw-medium);
  cursor: pointer; white-space: nowrap;
}
.nav-top button[aria-current="page"] { color: var(--c-text); border-bottom-color: var(--c-accent); }

/* Bottom navigation (Players App: phone first) ------------------------ */
.nav-bottom {
  position: sticky; bottom: 0;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--c-surface);
  border-top: 1px solid var(--c-border);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-bottom button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 56px;
  border: 0; background: none; color: var(--c-muted);
  font: inherit; font-size: var(--fs-xs); font-weight: var(--fw-medium);
  cursor: pointer;
}
.nav-bottom button[aria-current="page"] { color: var(--c-accent-strong); }
.nav-bottom .icon { width: 24px; height: 24px; }
@media (min-width: 1024px) {
  [data-app="players"] .nav-bottom { position: static; max-width: var(--content-max); margin: 0 auto; width: 100%; border: 1px solid var(--c-border); border-radius: var(--r-md); }
}

/* Icons -------------------------------------------------------------- */
.icon {
  width: var(--icon-size); height: var(--icon-size);
  flex: none;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}

/* Buttons ------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: var(--touch-min); min-width: var(--touch-min);
  padding: 0 var(--s-4);
  border-radius: var(--r-md);
  border: 1px solid transparent;
  font: inherit; font-weight: var(--fw-medium);
  cursor: pointer;
  text-decoration: none;
}
.btn-primary { background: var(--c-accent); color: var(--c-on-accent); }
.btn-secondary { background: var(--c-surface); color: var(--c-text); border-color: var(--c-border-control); }
.btn-ghost { background: transparent; color: var(--c-text); }
.btn-danger { background: var(--c-danger); color: #ffffff; }
.btn-icon { padding: 0; width: var(--touch-min); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:hover:not(:disabled) { filter: brightness(0.96); }
[data-app="players"] .btn { min-height: var(--touch-comfort); }

/* Segmented control (for example 2D / 3D, display modes) -------------- */
.segmented { display: inline-flex; border: 1px solid var(--c-border-control); border-radius: var(--r-md); overflow: hidden; background: var(--c-surface); }
.segmented button { min-height: var(--touch-min); padding: 0 var(--s-4); border: 0; background: none; font: inherit; color: var(--c-text-2); cursor: pointer; }
.segmented button + button { border-left: 1px solid var(--c-border-control); }
.segmented button[aria-pressed="true"] { background: var(--c-brand); color: var(--c-on-brand); }

/* Cards, fields, chips, badges, banners ------------------------------- */
.card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-lg); padding: var(--s-4); box-shadow: var(--shadow-1); }
.card + .card { margin-top: var(--s-4); }

.field { display: grid; gap: var(--s-1); }
.field label { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--c-text-2); }
.field input, .field select, .field textarea {
  min-height: var(--touch-min);
  padding: var(--s-2) var(--s-3);
  border: 1px solid var(--c-border-control); border-radius: var(--r-sm);
  font: inherit; color: var(--c-text); background: var(--c-surface);
}

.chip { display: inline-flex; align-items: center; min-height: var(--touch-min); min-width: var(--touch-min); justify-content: center; padding: 0 var(--s-3); border-radius: var(--r-pill); border: 1px solid var(--c-border-control); background: var(--c-surface); color: var(--c-text); font: inherit; font-size: var(--fs-sm); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--c-brand); color: var(--c-on-brand); border-color: var(--c-brand); }

.badge { display: inline-block; padding: 2px var(--s-2); border-radius: var(--r-sm); font-size: var(--fs-xs); font-weight: var(--fw-bold); letter-spacing: 0.02em; }
.badge-manual { color: var(--c-prov-manual); background: var(--c-prov-manual-bg); }
.badge-pending { color: var(--c-prov-pending); background: var(--c-prov-pending-bg); }
.badge-supp { color: var(--c-prov-supp); background: var(--c-prov-supp-bg); }

.banner { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) var(--s-4); border-radius: var(--r-md); border: 1px solid transparent; }
.banner .icon { margin-top: 2px; }
.banner-info { background: var(--c-info-bg); color: var(--c-info); border-color: #c7dcf3; }
.banner-warning { background: var(--c-warning-bg); color: var(--c-warning); border-color: #f2d98f; }
.banner-danger { background: var(--c-danger-bg); color: var(--c-danger); border-color: #f4c3bd; }
.banner-success { background: var(--c-success-bg); color: var(--c-success); border-color: #bfe2cc; }

/* About and licences -------------------------------------------------- */
.licence-text { max-height: 18rem; overflow: auto; background: var(--c-surface-2); padding: var(--s-3); border-radius: var(--r-sm); font-size: var(--fs-sm); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--s-1) var(--s-4); }
.kv dt { color: var(--c-muted); }
.kv dd { margin: 0; }

/* assets/css/players.css */
/*
 * Players App layout and components (Stage 3, approved design): charcoal and amber, text
 * navigation, a flat play list, a court-first viewer with labelled playback controls, phone
 * portrait and landscape, tablet and desktop layouts (library beside the viewer), full screen
 * with an in-page fallback. System fonts; no decorative graphics, gradients or textures.
 * Touch targets are at least 44 CSS px (48 px for main controls).
 */

[data-app="players"] { color-scheme: dark; }
[data-theme="player-light"] { color-scheme: light; }
[data-app="players"] body { background: var(--c-bg); }

/* Frame ------------------------------------------------------------- */
.pa { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.skip-link { position: absolute; left: -9999px; top: 0; z-index: 50; display: inline-flex; align-items: center; min-height: var(--touch-comfort); background: var(--c-accent); color: var(--c-on-accent); padding: 0 var(--s-4); border-radius: var(--r-sm); font-weight: var(--fw-bold); }
.skip-link:focus { left: var(--s-3); top: var(--s-2); }

.pa-top {
  display: flex; align-items: center; gap: var(--s-4);
  min-height: 52px; padding: env(safe-area-inset-top) max(var(--s-4), env(safe-area-inset-right)) 0 max(var(--s-4), env(safe-area-inset-left));
  background: var(--c-surface-2); border-bottom: 1px solid var(--c-border);
}
.pa-brand { display: flex; align-items: baseline; gap: var(--s-2); flex-wrap: wrap; padding: var(--s-2) 0; }
.pa-brand-name { font-weight: 800; letter-spacing: 0.14em; font-size: var(--fs-md); color: var(--c-text); }
.pa-brand-ed { font-size: var(--fs-xs); letter-spacing: 0.12em; font-weight: var(--fw-medium); color: var(--c-accent-strong); }

.pa-nav-top { display: none; margin-left: auto; gap: var(--s-1); }
.pa-navbtn { min-height: var(--touch-comfort); min-width: var(--touch-min); padding: 0 var(--s-4); border: 0; background: none; color: var(--c-muted); font: inherit; font-weight: var(--fw-medium); cursor: pointer; border-bottom: 3px solid transparent; }
.pa-navbtn[aria-current="page"] { color: var(--c-text); border-bottom-color: var(--c-accent); font-weight: var(--fw-bold); }
.pa-navbtn:hover { color: var(--c-text); }

.pa-nav-bottom {
  position: sticky; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--c-surface-2); border-top: 1px solid var(--c-border);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.pa-nav-bottom .pa-navbtn { min-height: 56px; border-bottom: 0; border-top: 3px solid transparent; font-size: var(--fs-sm); }
.pa-nav-bottom .pa-navbtn[aria-current="page"] { border-top-color: var(--c-accent); }
.pa[data-screen="play"] .pa-nav-bottom { display: none; }
.pa[data-layout="phone"][data-screen="play"] .pa-top { display: none; }

.pa-main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: var(--s-4) max(var(--s-4), env(safe-area-inset-right)) var(--s-6) max(var(--s-4), env(safe-area-inset-left)); }
.pa[data-screen="play"] .pa-main { padding: 0; max-width: none; }
.pa-main:focus { outline: none; }
.pa-banners:empty { display: none; }
.pa-banners { display: grid; gap: var(--s-2); padding: var(--s-2) var(--s-4) 0; max-width: 1200px; width: 100%; margin: 0 auto; }
.pa-banners .banner p, .banner-reminder p { margin: 0; flex: 1; }

/* Wide screens: top navigation, library beside the viewer */
@media (min-width: 900px) {
  .pa-nav-top { display: flex; }
  .pa-nav-bottom { display: none; }
  .pa[data-layout="wide"][data-screen="list"] .pa-main { max-width: 1400px; }
  .pa[data-layout="wide"][data-screen="list"] .pa-main { padding-bottom: var(--s-4); }
}
.pa-split { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; gap: var(--s-5); align-items: start; }
.pa-split-list { min-width: 0; max-height: calc(100dvh - 120px); overflow: auto; padding-right: var(--s-2); position: sticky; top: var(--s-3); }
.pa-split-detail { min-width: 0; position: sticky; top: var(--s-3); }
.pa-placeholder { display: grid; place-items: center; min-height: 50vh; border: 1px dashed var(--c-border); border-radius: var(--r-lg); color: var(--c-muted); padding: var(--s-5); text-align: center; }

/* Type and controls ---------------------------------------------------- */
[data-app="players"] h1 { font-size: 1.6rem; }
.h-sm { font-size: var(--fs-lg); font-weight: var(--fw-bold); margin-bottom: var(--s-2); }
.lead { color: var(--c-text-2); }
.text-danger { color: var(--c-danger); }
.text-warning { color: var(--c-warning); }

   * kind and order only, never from stored labels, rosters or display settings. Default actors

  /* Visibility (S1-D3 revised: per-step, optional, separate from removal) */
  /* ---------------------------------------------------------------- */

   * the play's collective defence setting (defenders only, ACT-07) and the step's own list of
   * individually hidden actors (`step.hidden`). Hiding never removes positions, identity,

  /* Lookups                                                           */
  /* ---------------------------------------------------------------- */

  PB.schema = Object.freeze({
    VERSION: SCHEMA_VERSION,
    ACTOR_KINDS: ACTOR_KINDS.slice(),
    PARTICIPANT_KINDS: PARTICIPANT_KINDS.slice(),
    STATIONARY_KINDS: STATIONARY_KINDS.slice(),
    EVENT_TYPES: EVENT_TYPES.slice(),
    BALL_EVENT_TYPES: BALL_EVENT_TYPES.slice(),
    SHOT_OUTCOMES: SHOT_OUTCOMES.slice(),
    COURTS: COURTS.slice(),
    DISPLAY_MODES: DISPLAY_MODES.slice(),
    SPEED_FACTORS: SPEED_FACTORS.slice(),
    LIMITS: LIMITS,
    DEFAULT_ATTACKERS: DEFAULT_ATTACKERS.slice(),
    DEFAULT_DEFENDERS: DEFAULT_DEFENDERS.slice(),
    newId: newId,
    setIdSource: setIdSource,
    isValidId: isValidId,
    isPlainObject: isPlainObject,
    isFiniteNumber: isFiniteNumber,
    clone: clone,
    canonicalJson: canonicalJson,
    defaultActors: defaultActors,
    defaultPositions: defaultPositions,
    defenderSpotFor: defenderSpotFor,
    isParticipant: isParticipant,
    isStationary: isStationary,
    nextExtraLabel: nextExtraLabel,
    nextCoachLabel: nextCoachLabel,
    nextActorId: nextActorId,
    createActor: createActor,
    createStep: createStep,
    createEvent: createEvent,
    createPlay: createPlay,
    createTeam: createTeam,
    createCategory: createCategory,
    createRoster: createRoster,
    createRosterPlayer: createRosterPlayer,
    actorMap: actorMap,
    hasDefaultActors: hasDefaultActors,
    canonicalLabels: canonicalLabels,
    isVisible: isVisible,
    visibleActorIds: visibleActorIds
  });
})();

/**
 * Module: geometry
 * Layer: Core
 * Responsibility: The single FIBA court definition in metres (dimensions, markings, bounds), coordinate rules, clamping, exact mirroring of coordinates, and marking-side tests used by validation, conversion, mirroring and the later renderers (spec 6.5, 6.10; GEO-01 to GEO-09).
 * Depends on: namespace, schema
 * Must not depend on: any engine, service, feature or shell module
 * Stage: 1
 * Provenance: written for this project at Stage 1 from specification v3 section 6.5, docs/behaviour/01-court-geometry.md and docs/formats/court-geometry.md. Values are FIBA court dimensions; original application code was not opened while writing (see provenance/records/stage1-module-records.md).

(function () {
  'use strict';
  var PB = window.PB;

  /*
   * Coordinate system (GEO-05). x runs from 0 at the left sideline to 15 at the right
   * sideline, as seen by a coach facing the attacking basket. y runs from 0 at the attacking
   * endline: 0 to 14 for half-court plays, 0 to 28 for full-court plays. All values are metres.
   * How the court is drawn on screen (which end is at the top: Q4, GEO-10) is a presentation
   * choice for the renderers and is deliberately not part of this definition.
   */
  var C = {
    width: 15,
    halfLength: 14,
    fullLength: 28,
    lineWidth: 0.05,             // GEO-03: dimensions are to the inside edge of lines
    margin: 2,                   // GEO-08: positions may lie up to 2 m outside the court
    basketFromEndline: 1.575,
    backboardFromEndline: 1.20,
    backboardWidth: 1.80,
    ringInnerDiameter: 0.45,
    ringHeight: 3.05,            // used by 3D only
    threePointRadius: 6.75,
    threePointSideOffset: 0.90,
    keyWidth: 4.90,
    freeThrowDistance: 5.80,     // far edge of the free-throw line from the endline
    freeThrowLineLength: 3.60,
    freeThrowCircleRadius: 1.80,
    noChargeRadius: 1.25,
    // Free-throw rebound places (OBR 2024 and 2026, Art. 2.5.3, Diagram 3): measured from the
    // inner edge of the endline along the outside of each restricted-area line.
    laneMarkFirst: 1.75,         // endline to the near edge of the first mark
    laneMarkSpace: 0.85,         // each clear space between marks (the marks' own width excluded)
    neutralZoneLength: 0.40,     // the filled neutral zone along the line
    laneMarkDepth: 0.10,         // marks and neutral zone extend 0.10 m out from the line
    centreCircleRadius: 1.80,
    halfwayY: 14

  /** y where the straight three-point lines meet the arc, computed (GEO-04), about 2.99 m. */

    Math.pow(CX - C.threePointSideOffset, 2));

   * `from`, `to` and `radius` are the dimensions as the FIBA rules state them. Stage 2 adds, for
   * every item, where the 0.05 m painted line lies (`edge`: which edge of the line is on the
   * dimension) and the centreline to draw with that width (`drawFrom`/`drawTo` or `drawRadius`).
   * Checked against the FIBA Official Basketball Rules 2024, Article 2 (dimensions unchanged by the
   * 2026 rule changes): boundary lines lie outside the court; the restricted area, free-throw line,
   * three-point line and the centre and free-throw circles are measured to their outer edge, so
   * the paint lies inside the dimension; the no-charge semicircle is 1.25 m to its inner edge
   * (1.30 m to its outer edge). See docs/engine/geometry-and-rendering.md.
   * Items with layer 'equipment' (backboard, ring and its support) are not floor markings.
   * A filled area {kind:'area', id, from, to} (opposite corners) is used for the neutral zones.
   * The free-throw rebound places follow Diagram 3 of the rules: each mark is a 0.05 m line
   * (Art. 2.5) 0.10 m long, perpendicular to the restricted-area line on its outside; the
   * neutral zone is a filled 0.40 m by 0.10 m block.

      [[kx0, -1, 'left'], [kx1, 1, 'right']].forEach(function (k) {

          line(prefix + 'lane-mark-' + k[2] + '-' + (i + 1), x0, Y(d + hw), xo, Y(d + hw), 'centre', 0, 0);
        });
        area(prefix + 'neutral-zone-' + k[2], x0, Y(nz0), xo, Y(nz1));
      });
      // Free-throw line: its furthest edge 5.80 m from the endline (2.5.3).
      line(prefix + 'free-throw-line', CX - C.freeThrowLineLength / 2, Y(C.freeThrowDistance), CX + C.freeThrowLineLength / 2, Y(C.freeThrowDistance), 'outer', 0, -sg * hw);
      // Free-throw semicircles: radius to the outer edge, centred on the middle of the free-throw line (2.5.2).
      var fy = Y(C.freeThrowDistance - hw);
      if (!flip) {
        arc(prefix + 'free-throw-circle-outer', CX, fy, C.freeThrowCircleRadius, 0, Math.PI, 'outer', -hw);
        arc(prefix + 'free-throw-circle-inner', CX, fy, C.freeThrowCircleRadius, Math.PI, 2 * Math.PI, 'outer', -hw, { dashed: true });
      } else {
        arc(prefix + 'free-throw-circle-outer', CX, fy, C.freeThrowCircleRadius, Math.PI, 2 * Math.PI, 'outer', -hw);
        arc(prefix + 'free-throw-circle-inner', CX, fy, C.freeThrowCircleRadius, 0, Math.PI, 'outer', -hw, { dashed: true });
      }
      // Three-point line: parallel lines with their outer edge 0.90 m from the sideline, arc of
      // 6.75 m to its outer edge (2.5.4). The drawn centreline meets its own arc.
      var xs0 = C.threePointSideOffset, xs1 = C.width - C.threePointSideOffset;

      var ad = Math.atan2(drawBreak, dxs);
      if (!flip) arc(prefix + 'three-arc', bx, by, C.threePointRadius, a, Math.PI - a, 'outer', -hw, { drawStart: ad, drawEnd: Math.PI - ad });
      else arc(prefix + 'three-arc', bx, by, C.threePointRadius, Math.PI + a, 2 * Math.PI - a, 'outer', -hw, { drawStart: Math.PI + ad, drawEnd: 2 * Math.PI - ad });

      // straight lines back to 1.20 m from the endline (2.5.7).
      var bb = Y(C.backboardFromEndline);

      line(prefix + 'no-charge-right', bx + C.noChargeRadius, bb, bx + C.noChargeRadius, by, 'inner', hw, 0);

      line(prefix + 'throw-in-right', C.width + w, ty, C.width + w + 0.15, ty, 'outer', 0, 0);
      // Equipment: backboard face 1.20 m from the endline, 1.80 m wide; ring of 0.45 m inside diameter.

      line(prefix + 'ring-support', bx, bb, bx, by - sg * ringR, 'centre', 0, 0, 0, 0, 'equipment');

  /* Positions                                                         */
  /* ---------------------------------------------------------------- */

  function isFinitePoint(p) {

    var b = bounds(court).permitted;
    var x = Math.min(b.maxX, Math.max(b.minX, p.x));
    var y = Math.min(b.maxY, Math.max(b.minY, p.y));

  /* Mirroring of coordinates (MIR-01, MIR-04, MIR-08)                 */
  /* ---------------------------------------------------------------- */

  var GRID = 1e8; // 10 nm

  /**
   * x → 15 − x. Values on a 10 nm grid (every centimetre, millimetre and typed value) are
   * mirrored on that grid, so mirroring twice returns the identical number. Values off the
   * grid use plain subtraction, which is within about 2e-15 m after two mirrors.
   */

    var k = Math.round(x * GRID);

    var full = 360 * GRID;

      return r / GRID;

  /* ---------------------------------------------------------------- */
  /* Marking sides (used by the conversion report, spec 7.3)           */
  /* ---------------------------------------------------------------- */

  /** Express a point relative to the basket of its own half: y measured from that endline. */
  function toOwnHalf(p, court) {
    if (court === 'full' && p.y > C.halfwayY) return { x: p.x, y: C.fullLength - p.y };
    return { x: p.x, y: p.y };

  /**
   * Signed distance from the three-point line of the point's own half: negative inside the
   * line (two-point area), positive outside. Straight parts and arc are both handled.
   */
  function threePointDistance(p, court) {

    var breakY = C.basketFromEndline + THREE_BREAK_DY;
    var xs0 = C.threePointSideOffset, xs1 = C.width - C.threePointSideOffset;
    if (q.y <= breakY) {

      if (q.x < CX) return xs0 - q.x;
      return q.x - xs1;
    }
    return distance(q, { x: CX, y: C.basketFromEndline }) - C.threePointRadius;
  }

  /**
   * Signed distance from the key (restricted area) boundary of the point's own half:
   * negative inside the key, positive outside.
   */
  function keyDistance(p, court) {
    var q = toOwnHalf(p, court);
    var x0 = CX - C.keyWidth / 2, x1 = CX + C.keyWidth / 2, y1 = C.freeThrowDistance;
    var dx = Math.max(x0 - q.x, 0, q.x - x1);
    var dy = Math.max(-q.y, 0, q.y - y1);
    if (dx === 0 && dy === 0) {
      return -Math.min(q.x - x0, x1 - q.x, q.y < 0 ? 0 : q.y, y1 - q.y);
    }
    return Math.sqrt(dx * dx + dy * dy);
  }

  PB.geometry = Object.freeze({
    COURT: Object.freeze(C),
    THREE_BREAK_Y: C.basketFromEndline + THREE_BREAK_DY,
    courtLength: courtLength,
    bounds: bounds,
    baskets: baskets,
    basketFor: basketFor,
    markings: markings,
    isFinitePoint: isFinitePoint,
    clampPoint: clampPoint,
    inPermitted: inPermitted,
    distance: distance,
    mirrorX: mirrorX,
    mirrorFacing: mirrorFacing,
    mirrorPoint: mirrorPoint,
    threePointDistance: threePointDistance,
    keyDistance: keyDistance
  });
})();

/**
 * Module: validate
 * Layer: Core

 * Must not depend on: any engine, service, feature or shell module
 * Stage: 1

  /* ---------------------------------------------------------------- */
  /* Field helpers                                                     */
  /* ---------------------------------------------------------------- */

  var CTRL_NAME = /[\u0000-\u001F\u007F\u2028\u2029]/g;

  }

  /** Validate a point and clamp it to the court plus margin (GEO-08). Returns a new point or null. */
  function point(r, v, path, court) {

  /* ---------------------------------------------------------------- */
  /* Play                                                              */
  /* ---------------------------------------------------------------- */

  var PLAY_FIELDS = ['id', 'v', 'name', 'notes', 'categoryId', 'tags', 'refs', 'court', 'defence', 'actors', 'steps', 'timing', 'source', 'legacy'];

  var STEP_FIELDS = ['id', 'note', 'possession', 'ball', 'pos', 'hidden', 'events'];

  function playInto(r, p, opts, base) {

    var bad = findDangerousKey(p, base || '$', 0);

    var out = {};
    out.id = id(r, p.id, base + '.id');
    if (p.v !== S.VERSION) {
      if (typeof p.v === 'number' && p.v > S.VERSION) r.error('E_VERSION_NEWER', base + '.v', 'This play was made by a newer version of the app (schema ' + p.v + '). Update the app to open it.');

    out.v = S.VERSION;

    if (p.tags !== undefined) {

      }

      else if (!Array.isArray(p.refs) || !p.refs.every(S.isValidId)) r.error('E_TYPE', base + '.refs', 'Resource links must be a list of identifiers.');

    var amap = {};
    if (!Array.isArray(p.actors) || !p.actors.length) { r.error('E_ACTORS', base + '.actors', 'A play needs a list of at least one player or marker.'); return null; }
    if (p.actors.length > L.actors) { r.error('E_TOO_MANY', base + '.actors', 'A play may have at most ' + L.actors + ' players and markers.'); return null; }
    p.actors.forEach(function (a, i) {

        if (p.timing.steps !== undefined) {

    // actions and possession stay exactly as stored; the coach is warned.

  }

  }

  function eventInto(r, e, ep, playOut, amap, eventIds) {

    if (S.EVENT_TYPES.indexOf(e.type) < 0) { r.warn('W_UNKNOWN_TYPE', ep + '.type', 'An action of an unknown type was left out (ACN-05).'); return null; }
    dropUnknown(r, e, EVENT_FIELDS, ep, 'an action');
    var o = { id: id(r, e.id, ep + '.id'), type: e.type };

    if (!S.isParticipant(actor)) { r.warn('W_STATIONARY_ACTION', ep + '.actor', 'Cones and markers cannot perform actions; the action was left out (ACT-05).'); return null; }
    o.actor = e.actor;
    if (e.to !== undefined && e.to !== null) { var t = point(r, e.to, ep + '.to', playOut.court); if (t) o.to = t; }
    if (e.bend !== undefined && e.bend !== null) {

    }
    if (e.target !== undefined && e.target !== null) {
      var tg = amap[e.target];
      if (!tg) r.error('E_REF_TARGET', ep + '.target', 'The action is aimed at someone who is not in the play.');
      else if (!S.isParticipant(tg)) r.error('E_REF_TARGET', ep + '.target', 'An action cannot be aimed at a cone or marker.');
      else if (e.target === e.actor) r.error('E_REF_TARGET', ep + '.target', 'An action cannot be aimed at the player performing it.');
      else o.target = e.target;
    }
    if (e.outcome !== undefined) {
      if (e.type !== 'shot') r.warn('W_UNKNOWN_FIELD', ep + '.outcome', 'Only shots have an outcome; it was left out.');

  /* ---------------------------------------------------------------- */
  /* Teams, categories, rosters                                        */
  /* ---------------------------------------------------------------- */

  var COLOUR = /^#[0-9A-Fa-f]{6}$/;

    var r = new Report();
    var o = null;
    if (!S.isPlainObject(t)) r.error('E_TYPE', '$', 'A team must be an object.');
    else {
      dropUnknown(r, t, ['id', 'name', 'colour', 'order', 'displayMode', 'logo'], '$', 'the team');
      o = { id: id(r, t.id, '.id'), name: text(r, t.name, '.name', L.nameChars, 'name', true) };

      if (t.displayMode === undefined) o.displayMode = 'default';
      else if (S.DISPLAY_MODES.indexOf(t.displayMode) < 0) { r.warn('W_DEFAULT', '.displayMode', 'Unknown display mode; default numbers are used.'); o.displayMode = 'default'; }
      else o.displayMode = t.displayMode;

  function categoriesInto(r, list, base) {
    var out = [], ids = {};
    if (!Array.isArray(list)) { r.error('E_TYPE', base, 'Categories must be a list.'); return out; }
    if (list.length > L.categoriesPerTeam) r.error('E_TOO_MANY', base, 'A team may have at most ' + L.categoriesPerTeam + ' categories.');
    list.slice(0, L.categoriesPerTeam).forEach(function (c, i) {
      var cp = base + '[' + i + ']';
      if (!S.isPlainObject(c)) { r.error('E_TYPE', cp, 'A category must be an object.'); return; }

      var cid = id(r, c.id, cp + '.id');

  }

  /**
   * Validate a team's categories and plays together, including play-id uniqueness and
   * category references. opts.context as for play(). opts.maxPlays overrides the team limit.

          playIds[v.id] = true;

        });
      }
    }
    return r.result(out);
  }

  /**
   * Validate a roster record (spec 6.4). opts.playIds (optional) lists the plays that exist,
   * so per-play overrides for missing plays can be reported. Assignments that point at missing

    else {

      if (!Array.isArray(players)) r.error('E_TYPE', '.players', 'Roster players must be a list.');

          var pp = '.players[' + i + ']';
          if (!S.isPlainObject(pl)) { r.error('E_TYPE', pp, 'A roster player must be an object.'); return; }

        if (src === undefined) return m;

        Object.keys(src).forEach(function (aid) {

        else Object.keys(input.playAssign).forEach(function (pid) {
          if (!S.isValidId(pid)) { r.warn('W_UNKNOWN_REF', '.playAssign.' + pid, 'Per-play assignments with an invalid play identifier were left out.'); return; }
          if (opts.playIds && opts.playIds.indexOf(pid) < 0) { r.warn('W_UNKNOWN_REF', '.playAssign.' + pid, 'Per-play assignments for a play that no longer exists were left out.'); return; }

          if (Object.keys(m).length) out.playAssign[pid] = m;
        });
      }
    }
    return r.result(out);
  }

  /**
   * Shared collection check for every playable-share writer (PB2 and Play Packs).
   * Returns {ok, plays (validated copies), categories (used ones, in order), labelChanges}.
   */

    if (!tv.ok) return { ok: false, error: { code: 'E_INVALID_COLLECTION', message: 'The selection cannot be shared: ' + tv.errors[0].message }, errors: tv.errors };
    var blocking = tv.warnings.filter(function (w) { return w.code === 'W_UNKNOWN_REF' && /categoryId$/.test(w.path) || w.code === 'W_CATEGORY_ORDER' || /^\.categories/.test(w.path); });

      .sort(function (a, b) { return (a.c.order - b.c.order) || (a.i - b.i); })
      .map(function (x, i) { return { id: x.c.id, name: x.c.name, order: i }; });

  /* Roster leakage (spec 6.8 "Roster leakage")                        */
  /* ---------------------------------------------------------------- */

    Report: Report,
    parseJson: parseJson,
    jsonDepth: jsonDepth,
    findDangerousKey: findDangerousKey,
    findRosterField: findRosterField,
    play: play,
    teamRecord: teamRecord,
    teamPlays: teamPlays,
    shareCollection: shareCollection,
    roster: roster,
    text: text,
    point: point
  });
})();

/**
 * Module: labels
 * Layer: Core
 * Responsibility: Resolves the text shown on each actor from the display mode and the team's roster assignments at display time only, and provides pure roster and assignment operations that never change play data (spec 6.4, Addendum 1 X1–X7; LBL-01 to LBL-06; Q3-c).
 * Depends on: namespace, schema
 * Must not depend on: any engine, service, feature or shell module
 * Stage: 1
 * Provenance: written for this project at Stage 1 from specification v3 section 6.4, Addendum 1, docs/behaviour/09-display-modes-and-labels.md and docs/formats/rosters-and-labels.md. Original application code was not opened while writing (see provenance/records/stage1-module-records.md).
 */
(function () {
  'use strict';
  var PB = window.PB;
  var S = PB.schema;

  /** The roster player assigned to an actor: per-play override first, then team level (LBL-03). */

    if (!roster) return null;

    var over = roster.playAssign && playId ? roster.playAssign[playId] : null;
    if (over && Object.prototype.hasOwnProperty.call(over, actorId)) pid = over[actorId];
    else if (roster.assign && Object.prototype.hasOwnProperty.call(roster.assign, actorId)) pid = roster.assign[actorId];

    var list = roster.players || [];

    return null;
  }

  /** First name, or initial and surname, fitted to maxChars with an ellipsis if needed (LBL-05). */

    var parts = n.split(' ');
    if (parts[0].length <= maxChars) return parts[0];
    if (parts.length > 1) {
      var initialSurname = parts[0].charAt(0) + '. ' + parts[parts.length - 1];
      if (initialSurname.length <= maxChars) return initialSurname;
    }
    if (maxChars <= 1) return n.charAt(0);
    return n.slice(0, maxChars - 1) + '…';
  }

  /**
   * Resolve one actor's label.
   * ctx: {mode, roster, playId, maxChars}. The Players App always passes mode 'default' (LBL-02).
   * Returns {text, full, source: 'default'|'roster', playerId}. `text` fits maxChars (jersey
   * numbers are never truncated); `full` is the complete text for tap, hover and accessible names.
   */
  function resolve(actor, ctx) {
    ctx = ctx || {};
    var mode = S.DISPLAY_MODES.indexOf(ctx.mode) >= 0 ? ctx.mode : 'default';
    var def = { text: actor.label, full: actor.label, source: 'default', playerId: null };
    // Only attackers take roster labels; defenders, coaches, cones and markers never do (LBL-04, Q3-c).
    if (mode === 'default' || actor.kind !== 'attacker') return def;
    var pl = assignedPlayer(ctx.roster, ctx.playId, actor.id);

    var jersey = pl.jersey || '';
    var name = pl.name || '';

    if (mode === 'jersey') {
      if (!jersey) return def;
      full = shown = jersey;
    } else if (mode === 'name') {
      if (!name) return def;
      full = name; shown = shortName(name, ctx.maxChars);
    } else { // jerseyName
      if (!jersey && !name) return def;
      full = (jersey + ' ' + name).trim();
      if (!jersey) shown = shortName(name, ctx.maxChars);
      else if (!name) shown = jersey;
      else {

        shown = jersey + (ctx.maxChars ? (room > 0 ? ' ' + shortName(name, room) : '') : ' ' + name);

  }

  /** Labels for every actor in a play, keyed by actor id. Never changes the play (LBL-06). */
  function resolveAll(play, ctx) {

    (play.actors || []).forEach(function (a) { out[a.id] = resolve(a, Object.assign({}, ctx, { playId: play.id })); });
    return out;
  }

  /* ---------------------------------------------------------------- */
  /* Pure roster operations: each returns a new roster record           */
  /* ---------------------------------------------------------------- */

  function copyRoster(r) { return S.clone(r || S.createRoster()); }

  function addPlayer(roster, name, jersey, id) {
    var r = copyRoster(roster);
    var p = S.createRosterPlayer(name, jersey, id);
    r.players.push(p);
    return { roster: r, player: p };
  }

  function updatePlayer(roster, playerId, fields) {
    var r = copyRoster(roster);
    r.players.forEach(function (p) {
      if (p.id !== playerId) return;
      if (fields.name !== undefined) p.name = String(fields.name);
      if (fields.jersey !== undefined) p.jersey = String(fields.jersey);
    });
    return r;
  }

  /** Remove a roster player and every assignment to them; actors fall back to defaults (spec 6.4). */
  function removePlayer(roster, playerId) {
    var r = copyRoster(roster);
    r.players = r.players.filter(function (p) { return p.id !== playerId; });
    Object.keys(r.assign).forEach(function (a) { if (r.assign[a] === playerId) delete r.assign[a]; });
    Object.keys(r.playAssign).forEach(function (pid) {
      var m = r.playAssign[pid];
      Object.keys(m).forEach(function (a) { if (m[a] === playerId) delete m[a]; });
      if (!Object.keys(m).length) delete r.playAssign[pid];
    });
    return r;
  }

  /** Team-level assignment; playerId null clears it (the actor slot becomes unassigned). */
  function assign(roster, actorId, playerId) {
    var r = copyRoster(roster);
    if (playerId) r.assign[actorId] = playerId; else delete r.assign[actorId];
    return r;
  }

  /**
   * Per-play override. playerId null removes the override (team-level assignment applies);
   * playerId false records an explicit "unassigned in this play" override.
   */
  function assignForPlay(roster, playId, actorId, playerId) {
    var r = copyRoster(roster);
    var m = r.playAssign[playId] || {};
    if (playerId === null || playerId === undefined) delete m[actorId];
    else m[actorId] = playerId === false ? '' : playerId;
    if (Object.keys(m).length) r.playAssign[playId] = m; else delete r.playAssign[playId];
    return r;
  }

  /** Remove the per-play overrides of a deleted play. */
  function forgetPlay(roster, playId) {
    var r = copyRoster(roster);
    delete r.playAssign[playId];
    return r;
  }

  /**
   * Copy a play for another team (or as a duplicate). Plays never hold roster data, so the
   * copy carries none; the source team's per-play overrides stay with the source roster.
   * The copy gets a new id and loses any legacy and source blocks (spec 7.1 item 6).
   */
  function copyPlayForTeam(play, opts) {
    opts = opts || {};
    var c = S.clone(play);
    c.id = opts.id || S.newId();
    delete c.legacy; delete c.source;
    c.categoryId = opts.categoryId === undefined ? null : opts.categoryId;
    return c;
  }

  PB.labels = Object.freeze({
    assignedPlayer: assignedPlayer,
    shortName: shortName,
    resolve: resolve,
    resolveAll: resolveAll,
    addPlayer: addPlayer,
    updatePlayer: updatePlayer,
    removePlayer: removePlayer,
    assign: assign,
    assignForPlay: assignForPlay,
    forgetPlay: forgetPlay,
    copyPlayForTeam: copyPlayForTeam
  });
})();

/**
 * Module: migrate
 * Layer: Core
 * Responsibility: Reads legacy data (version 3 backups, legacy team documents, the play inside PB1 codes) and converts it to version 4 with the proportional court conversion, a legacy block for unrecognised information, and a structured conversion report. Pure: never reads or writes storage (spec 7.1–7.6, 6.8).

 * Must not depend on: any engine, service, feature or shell module
 * Stage: 1
 * Provenance: written for this project at Stage 1 from specification v3 section 7 and docs/formats/legacy-formats.md, which records the legacy structures as observed in data produced by the existing app (black-box). The existing app's code was not opened while writing (see provenance/records/stage1-module-records.md).

(function () {
  'use strict';

  var S = PB.schema;
  var G = PB.geometry;

  /* ---------------------------------------------------------------- */
  /* Legacy geometry and conversion (spec 7.3)                          */
  /* ---------------------------------------------------------------- */

  }
  function legacyKeySide(p, court) {
    var q = legacyOwnHalf(p, court);
    var inside = q.x > LEGACY.hoop.x - LEGACY.keyHalfWidth && q.x < LEGACY.hoop.x + LEGACY.keyHalfWidth && q.y >= 0 && q.y < LEGACY.freeThrowY;
    return inside ? 'inside' : 'outside';
  }

  /** Known, unavoidable differences of the proportional mapping (spec 7.3 table). */
  var KNOWN_DIFFERENCES = [
    'The basket is 1 cm further from the baseline than in the old drawing (not visible).',
    'The top of the three-point arc is about 0.3 m closer to the basket on the FIBA court, so a player just outside the old arc is still outside the new one.',
    'The corner three-point lines stay 0.90 m from the sidelines.',
    'The FIBA key is 0.10 m wider: a player standing on the old lane line can appear up to 5 cm inside the new key.',
    'The FIBA free-throw line is about 0.14 m further from the baseline: a player on the old free-throw line appears slightly below the new one.',
    'Across and along the court the scale differs by less than 1%, so angles change by an amount that is not visible.'
  ];

  /* Legacy category ids and their names, in the order the existing app lists them (observed). */
  var LEGACY_CATEGORIES = [
    ['fiveout', '5-Out Plays'], ['fourout', '4-Out Plays'], ['zone', 'Zone Plays'], ['press', 'Press'],
    ['pressbreak', 'Press Break'], ['inbounds', 'Inbounds Plays'], ['drills', 'Drills'],
    ['spacing', 'Offensive spacing and movement'], ['defsetup', 'Defensive setup and rotations']
  ];
  var ZONE_TAGS = { '2-3': '2-3 zone', '3-2': '3-2 zone', '1-3-1': '1-3-1 zone' };

  var LEGACY_ACTORS = ['o1', 'o2', 'o3', 'o4', 'o5', 'd1', 'd2', 'd3', 'd4', 'd5'];
  var LEGACY_PLAY_KEYS = ['id', 'name', 'notes', 'category', 'court', 'defense', 'steps', 'removedO', 'removedD', 'zone'];
  var LEGACY_STEP_KEYS = LEGACY_ACTORS.concat(['ball', 'note', 'actions', 'hidden']);
  var LEGACY_ACTION_KEYS = ['id', 'type', 'p', 'to', 'c', 'target'];
  var LEGACY_TEAM_KEYS = ['team', 'players', 'plays', 'events', 'stats', 'announcements', 'shots', 'hiddenCats', 'seed'];
  var EXCLUDED_TEAM_DATA = {
    events: 'Calendar events belong to features the new app does not include (spec 7.4, U5).',
    stats: 'Statistics belong to features the new app does not include (spec 7.4, U5).',
    announcements: 'Announcements belong to features the new app does not include (spec 7.4, U5).',
    shots: 'Shot records belong to features the new app does not include (spec 7.4, U5).',
    hiddenCats: 'The old app\'s list of categories hidden from players is not used by the new apps (spec 7.4).',
    seed: 'Internal settings the old app used to manage its own starter plays; not needed by the new apps.'
  };

  /* ---------------------------------------------------------------- */
  /* Conversion report                                                  */
  /* ---------------------------------------------------------------- */

  /**
   * Levels: 'info' (for the record), 'notice' (a default was applied or something was kept for
   * reference), 'attention' (the coach should check this play), 'rejected' (not imported).
   */
  function newReport(format, formatVersion) {
    return {
      kind: 'conversion-report', reportVersion: 1,
      source: { format: format, formatVersion: formatVersion },
      summary: { teams: 0, playsFound: 0, playsConverted: 0, playsNeedingAttention: 0, playsRejected: 0, steps: 0, events: 0, rosterPlayers: 0 },
      plays: [], items: [], unrecognised: [], defaults: [], excluded: [],
      coordinateConversion: {
        method: 'proportional',
        factors: { x: FX, y: FY },
        description: 'Each old position is scaled by its place between the sidelines and between the baseline and halfway line, so spacing relative to the court edges is kept exactly (spec 7.3).',
        knownDifferences: KNOWN_DIFFERENCES.slice()
      },
      markings: [], unresolved: []
    };
  }

  function item(rep, level, code, message, where, detail) {
    var it = { level: level, code: code, message: message, where: where || {} };
    if (detail !== undefined) it.detail = detail;
    rep.items.push(it);
    return it;
  }

  /* ---------------------------------------------------------------- */
  /* Small helpers                                                      */
  /* ---------------------------------------------------------------- */

  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function isLegacyPoint(v) { return S.isPlainObject(v) && isNum(v.x) && isNum(v.y); }

  function cleanText(v, limit, kind) {
    if (typeof v !== 'string') return { text: '', changed: v !== undefined && v !== null, truncated: false };
    var t = kind === 'name' ? v.replace(/[\u0000-\u001F\u007F\u2028\u2029]/g, ' ').replace(/\s+/g, ' ').trim()
      : v.replace(/[\u0000-\u0008\u000B-\u001F\u007F\u2028\u2029]/g, '');
    var truncated = t.length > limit;
    return { text: truncated ? t.slice(0, limit) : t, changed: t !== v, truncated: truncated };
  }

  /** Keep unrecognised plain data, within a size budget, in the legacy block (spec 7.5 last row). */
  function keepUnrecognised(legacy, rep, where, key, value) {
    var json;
    try { json = JSON.stringify(value); } catch (e) { json = null; }
    var path = (where.path || '') + key;
    rep.unrecognised.push({ where: where, field: path });
    if (json !== null && json !== undefined && json.length <= 4000) {
      legacy.unrecognised = legacy.unrecognised || {};
      legacy.unrecognised[path] = JSON.parse(json);
      return true;
    }
    item(rep, 'notice', 'N_UNRECOGNISED_DROPPED', 'Unrecognised information "' + key + '" was too large to keep and was left out.', where);
    return false;
  }

  /* ---------------------------------------------------------------- */
  /* One legacy play                                                    */
  /* ---------------------------------------------------------------- */

  /**
   * Convert one legacy play. ctx: {report, origin, teamName, categoryIds (legacy id → v4 id),
   * usedIds (object), playIndex}. Returns the version 4 play, or null if it was rejected.
   * The input is never changed.
   */
  function convertPlay(lp, ctx) {
    var rep = ctx.report;
    var where = { team: ctx.teamName || '', play: '', path: '' };
    rep.summary.playsFound++;
    var entry = { team: ctx.teamName || '', name: '', id: '', status: 'converted', notes: [] };
    rep.plays.push(entry);
    function reject(msg) {
      entry.status = 'rejected'; entry.notes.push(msg);
      rep.summary.playsRejected++;
      item(rep, 'rejected', 'R_PLAY', msg, where);
      return null;
    }
    function attention(code, msg, w) { entry.status = entry.status === 'rejected' ? 'rejected' : 'attention'; entry.notes.push(msg); item(rep, 'attention', code, msg, w || where); }
    function notice(code, msg, w) { entry.notes.push(msg); item(rep, 'notice', code, msg, w || where); }

    if (!S.isPlainObject(lp)) return reject('An entry in the play list is not a play and was not imported.');
    var legacy = {};
    var nm = cleanText(lp.name, L.nameChars, 'name');
    var name = nm.text || 'Untitled play';
    where.play = name; entry.name = name;
    if (!nm.text) { rep.defaults.push({ where: where, what: 'play name', value: 'Untitled play' }); notice('N_DEFAULT_NAME', 'The play had no name and was called "Untitled play".'); }
    if (nm.truncated) { legacy.originalName = lp.name; attention('A_NAME_SHORTENED', 'The play name was longer than ' + L.nameChars + ' characters and was shortened; the full name is kept in the conversion details.'); }

    // Identifier: legacy ids are kept (spec 6.1 item 4) unless missing, invalid or already used.
    var pid = lp.id;
    if (!S.isValidId(pid) || ctx.usedIds[pid]) {
      if (pid !== undefined) legacy.originalId = typeof pid === 'string' ? pid : JSON.stringify(pid);
      pid = S.newId();
      notice('N_NEW_ID', 'The play was given a new identifier because its old one was missing, invalid or used twice.');
    }
    ctx.usedIds[pid] = true; entry.id = pid; where.playId = pid;

    if (!Array.isArray(lp.steps) || !lp.steps.length) return reject('"' + name + '" has no steps and was not imported.');
    if (lp.steps.length > L.steps) return reject('"' + name + '" has ' + lp.steps.length + ' steps; the limit is ' + L.steps + '. It was not imported so that nothing is lost silently; it remains in the original backup.');

    var court = 'half';
    if (lp.court === 'full') court = 'full';
    else if (lp.court !== undefined && lp.court !== 'half') { legacy.court = lp.court; attention('A_COURT', 'The court type "' + String(lp.court) + '" was not recognised; the play was imported as a half-court play.'); }

    var notesT = cleanText(lp.notes, L.noteChars, 'note');
    if (notesT.truncated) { legacy.originalNotes = lp.notes; attention('A_NOTES_SHORTENED', 'The coaching notes were longer than ' + L.noteChars + ' characters and were shortened; the full text is kept in the conversion details.'); }

    var defence = lp.defense === true;
    if (lp.defense !== undefined && typeof lp.defense !== 'boolean') notice('N_DEFENCE', 'The defence setting was not true or false; defence is off.');

    // Actors: the ten legacy positions minus removed ones (spec 7.5 removedO/removedD).
    var removed = {};
    ['removedO', 'removedD'].forEach(function (k) {
      if (lp[k] === undefined) return;
      if (!Array.isArray(lp[k])) { keepUnrecognised(legacy, rep, where, k, lp[k]); return; }
      legacy[k] = lp[k].slice(0, 20);
      lp[k].forEach(function (a) { if (LEGACY_ACTORS.indexOf(a) >= 0) removed[a] = true; });
    });
    var actors = S.defaultActors().filter(function (a) { return !removed[a.id]; });
    if (!actors.length) return reject('"' + name + '" has every player removed and was not imported.');
    var amap = {};
    actors.forEach(function (a) { amap[a.id] = a; });
    var removedCount = Object.keys(removed).length;
    if (removedCount) item(rep, 'info', 'I_REMOVED_ACTORS', 'Players removed in the old app (' + Object.keys(removed).sort().join(', ') + ') were not created.', where);

    var markingsBefore = rep.markings.length;
    var defaults = S.defaultPositions();
    var steps = [];
    var prevPos = null;
    var prevStepLegacy = null;

    for (var k = 0; k < lp.steps.length; k++) {
      var ls = lp.steps[k];
      var sw = { team: where.team, play: name, playId: pid, step: k + 1, path: 'steps[' + k + '].' };
      if (!S.isPlainObject(ls)) {
        return reject('Step ' + (k + 1) + ' of "' + name + '" is damaged, so the play was not imported.');
      }
      var step = { id: S.newId(), note: '', pos: {}, events: [] };
      var nt = cleanText(ls.note, L.noteChars, 'note');
      step.note = nt.text;
      if (nt.truncated) { legacy.stepNotes = legacy.stepNotes || {}; legacy.stepNotes[step.id] = ls.note; attention('A_NOTE_SHORTENED', 'A step note was longer than ' + L.noteChars + ' characters and was shortened; the full text is kept in the conversion details.', sw); }

      // Positions
      actors.forEach(function (a) {
        var p = ls[a.id];
        var conv;
        if (isLegacyPoint(p)) conv = convertPoint(p);
        else if (prevPos && prevPos[a.id]) {
          conv = { x: prevPos[a.id].x, y: prevPos[a.id].y };
          rep.defaults.push({ where: sw, what: 'position of ' + a.label, value: 'carried from the previous step' });
          attention('A_POSITION_MISSING', 'Player ' + a.label + ' had no position in step ' + (k + 1) + '; the position from the previous step was used.', sw);
        } else {
          conv = { x: defaults[a.id].x, y: defaults[a.id].y };
          rep.defaults.push({ where: sw, what: 'position of ' + a.label, value: 'default layout' });
          attention('A_POSITION_MISSING', 'Player ' + a.label + ' had no position in step ' + (k + 1) + '; the default layout position was used.', sw);
        }
        var c = G.clampPoint(conv, court);
        if (c.clamped) attention('A_CLAMPED', 'Player ' + a.label + ' in step ' + (k + 1) + ' was outside the court and its margin, and was moved to the edge.', sw);
        step.pos[a.id] = { x: c.x, y: c.y };
        if (isLegacyPoint(p)) checkMarkings(rep, { team: where.team, play: name, step: k + 1, who: 'player ' + a.label, kind: 'position' }, p, step.pos[a.id], court);
      });

      // Ball state at the start of the step (spec 7.5 ball → possession; BAL-09 for loose balls)
      var holder = ls.ball;
      if (typeof holder === 'string' && holder && amap[holder] && S.isParticipant(amap[holder])) {
        step.possession = holder;
      } else {
        if (typeof holder === 'string' && holder && removed[holder]) notice('N_BALL_REMOVED_HOLDER', 'In step ' + (k + 1) + ' the ball was held by a removed player, so it is shown loose.', sw);
        else if (holder !== undefined && holder !== null && holder !== '') notice('N_BALL_UNKNOWN', 'In step ' + (k + 1) + ' the ball holder was not recognised, so the ball is shown loose.', sw);
        var spot = derivedLooseBall(prevStepLegacy, steps.length ? steps[steps.length - 1] : null, step, court);
        step.ball = spot.point;
        rep.defaults.push({ where: sw, what: 'loose-ball position', value: spot.rule });
        notice('N_BALL_DERIVED', 'In step ' + (k + 1) + ' nobody had the ball; it was placed ' + spot.rule + ' (BAL-09).', sw);
      }

      // Players hidden in this step only ("Remove from step N only" in the old app, observed as a
      // list of actor ids): kept as the version 4 per-step hidden list (S1-D3 revised).
      if (Array.isArray(ls.hidden)) {
        var hid = [];
        ls.hidden.forEach(function (aid) {
          if (typeof aid === 'string' && amap[aid]) { if (hid.indexOf(aid) < 0) hid.push(aid); }
          else if (typeof aid === 'string' && removed[aid]) { /* removed from the whole play already */ }
          else notice('N_HIDDEN_UNKNOWN', 'A player hidden in step ' + (k + 1) + ' was not recognised; the entry was left out.', sw);
        });
        if (hid.length) {
          step.hidden = hid;
          item(rep, 'info', 'I_HIDDEN_ACTORS', 'In step ' + (k + 1) + ', ' + hid.map(function (h) { return amap[h].label; }).join(', ') + (hid.length === 1 ? ' is' : ' are') + ' hidden, as in the old app.', sw);
        }
      } else if (ls.hidden !== undefined && ls.hidden !== null && ls.hidden !== false) {
        keepUnrecognised(legacy, rep, sw, 'hidden', ls.hidden);
        notice('N_HIDDEN_FORM', 'Step ' + (k + 1) + ' had a hidden setting in a form the old app does not write; it is kept in the conversion details and nobody is hidden.', sw);
      }

      // Actions → events
      var acts = ls.actions === undefined ? [] : ls.actions;
      if (!Array.isArray(acts)) { keepUnrecognised(legacy, rep, sw, 'actions', acts); acts = []; attention('A_ACTIONS_DAMAGED', 'The actions of step ' + (k + 1) + ' were not a list and could not be converted; they are kept in the conversion details.', sw); }
      var eventIds = ctx.eventIds;
      acts.forEach(function (la, i) {
        var ew = { team: where.team, play: name, playId: pid, step: k + 1, action: i + 1, path: 'steps[' + k + '].actions[' + i + '].' };
        var ev = convertAction(rep, la, ew, step, lp.steps[k + 1], amap, removed, court, legacy, eventIds, attention, notice);
        if (ev) step.events.push(ev);
      });
      if (step.events.length > L.eventsPerStep) {
        legacy.droppedEvents = (legacy.droppedEvents || []).concat(step.events.slice(L.eventsPerStep));
        step.events = step.events.slice(0, L.eventsPerStep);
        attention('A_TOO_MANY_ACTIONS', 'Step ' + (k + 1) + ' had more than ' + L.eventsPerStep + ' actions; the extra actions are kept in the conversion details.', sw);
      }

      Object.keys(ls).forEach(function (key) {
        if (LEGACY_STEP_KEYS.indexOf(key) >= 0) return;
        if (removed[key] || LEGACY_ACTORS.indexOf(key) >= 0) return;
        keepUnrecognised(legacy, rep, sw, key, ls[key]);
      });
      // Positions of removed players are not needed; note only that they existed.
      prevPos = step.pos;
      prevStepLegacy = ls;
      steps.push(step);
      rep.summary.steps++;
      rep.summary.events += step.events.length;
    }
    var moved = rep.markings.length - markingsBefore;
    if (moved) attention('A_MARKING_SIDE', moved + (moved === 1 ? ' position or end point is' : ' positions or end points are') + ' now on the other side of a court marking because the FIBA markings differ from the old court; check the positions listed below (spec 7.3).');

    var play = { id: pid, v: S.VERSION, name: name, notes: notesT.text, categoryId: null, court: court, defence: defence, actors: actors, steps: steps };

    // Category (spec 7.5) and zone (kept as a tag; original value in legacy)
    if (typeof lp.category === 'string' && lp.category) {
      play.categoryId = ctx.categoryIds[lp.category] || null;
    } else if (lp.category !== undefined && lp.category !== null && lp.category !== '') {
      keepUnrecognised(legacy, rep, where, 'category', lp.category);
    }
    if (lp.zone !== undefined && lp.zone !== null && lp.zone !== '') {
      legacy.zone = lp.zone;
      var zt = typeof lp.zone === 'string' ? (ZONE_TAGS[lp.zone] || cleanText(lp.zone, L.tagChars, 'name').text) : '';
      if (zt) play.tags = [zt];
      item(rep, 'info', 'I_ZONE_TAG', 'The zone setting "' + String(lp.zone) + '" is kept as the tag "' + zt + '".', where);
    }
    Object.keys(lp).forEach(function (key) {
      if (LEGACY_PLAY_KEYS.indexOf(key) < 0) keepUnrecognised(legacy, rep, where, key, lp[key]);
    });

    play.source = { origin: ctx.origin, converter: 'migrate/1', legacyUnits: { width: LEGACY.width, length: court === 'full' ? LEGACY.fullLength : LEGACY.halfLength } };
    if (Object.keys(legacy).length) play.legacy = legacy;

    // Final check: the converted play must pass the shared validator unchanged in meaning.
    var check = V.play(play, { context: 'storage' });
    if (!check.ok) {
      return reject('"' + name + '" could not be converted into a valid play: ' + check.errors.map(function (e) { return e.message; }).join(' '));
    }
    check.warnings.forEach(function (w) {
      if (w.code === 'W_BALL_RULE' || w.code === 'W_HIDDEN_HOLDER') attention('A_' + w.code.slice(2), w.message + ' (' + w.path.replace(/^\./, '') + ')');
    });
    if (entry.status === 'attention') rep.summary.playsNeedingAttention++;
    rep.summary.playsConverted++;
    return check.value;
  }

  /** Loose-ball position for a legacy step with no holder (BAL-09, legacy rule). */
  function derivedLooseBall(prevLegacy, prevStep, step, court) {
    if (prevLegacy && prevStep && Array.isArray(prevLegacy.actions)) {
      for (var i = prevLegacy.actions.length - 1; i >= 0; i--) {
        var a = prevLegacy.actions[i];
        if (!S.isPlainObject(a)) continue;
        if (a.type === 'pass' && isLegacyPoint(a.to)) return { point: clampP(convertPoint(a.to), court), rule: 'at the end of the previous step\'s last pass' };
        if (a.type === 'pass' && typeof a.target === 'string' && step.pos[a.target]) return { point: clampP(step.pos[a.target], court), rule: 'at the receiver of the previous step\'s last pass' };
        if (a.type === 'shot') {
          var shooter = prevStep.pos[a.p];
          var b = G.basketFor(court, shooter || { x: 7.5, y: 1 });
          return { point: { x: b.x, y: b.y }, rule: 'at the basket after the previous step\'s shot' };
        }
      }
    }
    return { point: { x: 7.5, y: 7.0 }, rule: 'at the centre of the half court' };
  }
  function clampP(p, court) { var c = G.clampPoint(p, court); return { x: c.x, y: c.y }; }

  function convertAction(rep, la, ew, step, nextLegacyStep, amap, removed, court, legacy, eventIds, attention, notice) {
    if (!S.isPlainObject(la)) { attention('A_ACTION_DAMAGED', 'A damaged action in step ' + ew.step + ' was left out.', ew); return null; }
    var keep = function () { legacy.droppedActions = legacy.droppedActions || []; if (legacy.droppedActions.length < 200) legacy.droppedActions.push(S.clone(la)); };
    if (S.EVENT_TYPES.indexOf(la.type) < 0) {
      keep(); attention('A_ACTION_TYPE', 'An action of unknown type "' + String(la.type) + '" in step ' + ew.step + ' was left out (ACN-05); it is kept in the conversion details.', ew); return null;
    }
    var actor = la.p;
    if (typeof actor !== 'string' || !amap[actor]) {
      keep();
      if (removed[actor]) notice('N_ACTION_REMOVED_ACTOR', 'An action by a removed player in step ' + ew.step + ' was left out; it is kept in the conversion details.', ew);
      else attention('A_ACTION_ACTOR', 'An action in step ' + ew.step + ' belonged to an unknown player and was left out; it is kept in the conversion details.', ew);
      return null;
    }
    var ev = { id: S.isValidId(la.id) && !eventIds[la.id] ? la.id : S.newId(), type: la.type, actor: actor };
    eventIds[ev.id] = true;
    if (la.to !== undefined && la.to !== null) {
      if (isLegacyPoint(la.to)) {
        var c = G.clampPoint(convertPoint(la.to), court);
        if (c.clamped) attention('A_CLAMPED', 'An action end point in step ' + ew.step + ' was outside the court and its margin, and was moved to the edge.', ew);
        ev.to = { x: c.x, y: c.y };
        checkMarkings(rep, { team: ew.team, play: ew.play, step: ew.step, who: 'end point of ' + amap[actor].label + '\'s ' + la.type, kind: 'end point' }, la.to, ev.to, court);
      } else keepUnrecognised(legacy, rep, ew, 'to', la.to);
    }
    if (la.c !== undefined && la.c !== null) {
      if (!isLegacyPoint(la.c)) keepUnrecognised(legacy, rep, ew, 'c', la.c);
      else if (!ev.to) { keep(); notice('N_CURVE_WITHOUT_END', 'A curve on an action without an end point in step ' + ew.step + ' could not be used.', ew); }
      else {
        // The old app stored a quadratic control point; the new bend is a point the curve passes
        // through. The point of the old curve halfway along its parameter keeps the drawn shape.
        var p0 = step.pos[actor], cc = convertPoint(la.c), p2 = ev.to;
        var bend = { x: 0.25 * p0.x + 0.5 * cc.x + 0.25 * p2.x, y: 0.25 * p0.y + 0.5 * cc.y + 0.25 * p2.y };
        var bc = G.clampPoint(bend, court);
        if (bc.clamped) attention('A_CLAMPED', 'A curve in step ' + ew.step + ' reached outside the court and its margin, and was pulled in.', ew);
        ev.bend = { x: bc.x, y: bc.y };
      }
    }
    if (la.target !== undefined && la.target !== null && la.target !== '') {
      var t = la.target;
      if (typeof t === 'string' && amap[t] && t !== actor) ev.target = t;
      else if (typeof t === 'string' && removed[t]) {
        // ACT-04: an action aimed at a removed player becomes an action to a spot.
        var nextP = nextLegacyStep && isLegacyPoint(nextLegacyStep[t]) ? nextLegacyStep[t] : null;
        if (!ev.to && nextP) ev.to = clampP(convertPoint(nextP), court);
        notice('N_TARGET_REMOVED', 'An action in step ' + ew.step + ' was aimed at a removed player; it now goes to that spot instead.', ew);
      } else notice('N_TARGET_UNKNOWN', 'An action in step ' + ew.step + ' was aimed at an unknown player; the receiver was left out.', ew);
    }
    if (la.type === 'shot') ev.outcome = 'unspecified';
    Object.keys(la).forEach(function (key) { if (LEGACY_ACTION_KEYS.indexOf(key) < 0) keepUnrecognised(legacy, rep, ew, key, la[key]); });
    // Requirements the new model enforces (05-actions.md)
    if ((la.type === 'cut' || la.type === 'move' || la.type === 'dribble') && !ev.to) {
      keep(); attention('A_ACTION_INCOMPLETE', 'A ' + la.type + ' in step ' + ew.step + ' had no end point and was left out; it is kept in the conversion details.', ew); return null;
    }
    if (la.type === 'pass' && !ev.to && !ev.target) {
      keep(); attention('A_ACTION_INCOMPLETE', 'A pass in step ' + ew.step + ' had no receiver or end point and was left out; it is kept in the conversion details.', ew); return null;
    }
    if (la.type === 'handoff' && !ev.target) {
      keep(); attention('A_ACTION_INCOMPLETE', 'A handoff in step ' + ew.step + ' had no receiver and was left out; it is kept in the conversion details.', ew); return null;
    }
    return ev;
  }

  /** Record a marking-side change for the conversion report (spec 7.3, last paragraph). */
  function checkMarkings(rep, who, legacyPoint, newPoint, court) {
