        if (outcome === 'missed') {
          // Rebound to the next step's ball state, or to the shot's own end point (ACN-24, BAL-08).
          var target = null;
          if (nextState) target = nextState.kind === 'held' ? { actor: nextState.actor } : { p: cp(nextState.p) };
          else if (e.to && dist(e.to, bpt) > 0.3) target = { p: cp(e.to) };
          if (target && tr.end > arrive + EPS) {
            segs.push({ kind: 'rebound', t0: arrive, t1: tr.end, from: bpt, toActor: target.actor || null, toPoint: target.p || null, eventId: e.id });
            state = target.actor ? { kind: 'held', actor: target.actor } : { kind: 'rest', p: target.p };
            since = tr.end; busy = tr.end; pending = target.actor || null;
            shot.reboundTo = target.actor || target.p;
            return;
          }
          ctx.issue('info', 'I_SHOT_RESTS', path, 'This missed shot has no rebound destination (no holder or ball position in the next step and no end point away from the basket), so the ball rests at the basket (ACN-24).');
        }
        // Made or unspecified (or a missed shot with nowhere to go): the ball comes to rest beneath the basket.
        var dropEnd = Math.min(tr.end, after + timing.drop);
        if (dropEnd > after + EPS) segs.push({ kind: 'drop', t0: after, t1: dropEnd, at: bpt, eventId: e.id, outcome: outcome });
        state = { kind: 'rest', p: bpt };
        since = dropEnd; busy = dropEnd; pending = null;
      } else if (e.type === 'handoff') {
        var tt = x.transfer, w0 = Math.max(since, tt - timing.handoffTransfer);
        close(w0);
        segs.push({ kind: 'transfer', t0: w0, t1: tt, giver: e.actor, receiver: e.target, eventId: e.id });
        var gap = dist(posAt(ctx, tr, e.actor, tt), posAt(ctx, tr, e.target, tt));
        if (gap > B.handoffGap + 1e-9) ctx.issue('warning', 'W_HANDOFF_GAP', path, 'At the handoff, ' + amap[e.target].label + ' is ' + round2(gap) + ' m from ' + amap[e.actor].label + ', more than ' + B.handoffGap + ' m (ACN-20).');
        x.ball = { transfer: tt, gap: gap };
        state = { kind: 'held', actor: e.target };
        since = tt; busy = tt; pending = null;
      }
    });

    // State changes between steps that no action explains.
    if (!changed && nextState) {
      if (state.kind === 'rest' && nextState.kind === 'held') {
        // Explicit pick-up: the next step names the holder (S1-D9). Proximity only times it (BAL-10, BAL-18).
        var who = nextState.actor, P0 = cp(state.p);
        var tc = firstWithin(ctx, tr, who, P0, B.pickupRadius);
        close(tc === null ? tr.holdEnd : tc);
        if (tc !== null) {
          var blend = Math.min(timing.attach, tr.end - tc);
          segs.push({ kind: 'attach', t0: tc, t1: tc + blend, from: P0, actor: who });
          state = { kind: 'held', actor: who }; since = tc + blend;
          tr.pickup = { actor: who, at: tc, mode: 'waits' };
        } else {
          segs.push({ kind: 'pickup', t0: tr.holdEnd, t1: tr.end, from: P0, actor: who });
          state = { kind: 'held', actor: who }; since = tr.end;
          tr.pickup = { actor: who, at: tr.end, mode: 'travels' };
        }
        changed = true;
      } else if (state.kind === 'rest' && nextState.kind === 'rest' && dist(state.p, nextState.p) > SAME) {
        close(tr.holdEnd);
        segs.push({ kind: 'loose', t0: tr.holdEnd, t1: tr.end, from: cp(state.p), to: cp(nextState.p) }); // BAL-09
        state = { kind: 'rest', p: cp(nextState.p) }; since = tr.end; changed = true;
      } else if (state.kind === 'held' && nextState.kind === 'rest' && !step.events.some(function (e) { return S.BALL_EVENT_TYPES.indexOf(e.type) >= 0 && e.type !== 'dribble'; })) {
        close(tr.holdEnd);
        segs.push({ kind: 'putdown', t0: tr.holdEnd, t1: tr.end, actor: state.actor, to: cp(nextState.p) }); // BAL-11
        state = { kind: 'rest', p: cp(nextState.p) }; since = tr.end; changed = true;
      }
    }
    close(tr.end);
    tr.ballEnd = state;
    tr.ballSegments = segs;
    if (nextState && !sameState(state, nextState)) {
      // BAL-12: warn, and move the ball to the stored state over the last part of the move phase.
      ctx.issue('warning', 'W_BALL_MISMATCH', '$.steps[' + (tr.index + 1) + ']', 'At the end of step ' + (tr.index + 1) + ' the actions leave the ball ' + stateLabel(state) + ', but step ' + (tr.index + 2) + ' has it ' + stateLabel(nextState) + '. Playback moves the ball to the stored state at the end of the step (BAL-12).');
      tr.correction = { t0: Math.max(tr.holdEnd, tr.end - timing.correction), t1: tr.end, target: nextState, computed: state };
      tr.ballEnd = nextState;
    }
  }

  /** When a handoff transfers the ball: when the giver reaches `to`, or at the start if the giver does not move (ACN-20). */
  function handoffTime(ctx, tr, x) {
    var e = x.event, tk = tr.tracks[e.actor];
    var g = null, ev = null;
    tk.groups.forEach(function (gr) { gr.events.forEach(function (it) { if (it.id === e.id) { g = gr; ev = it; } }); });
    if (g && ev && ev.s1 - ev.s0 > SAME) return ev.t1;
    // A giver who does not move hands off at the action's start; the 0.2 s transfer is kept inside the move phase.
    return Math.max(x.start, tr.holdEnd + ctx.timing.handoffTransfer);
  }

  /** First time in the move phase at which an actor is within r of a point, or null (BAL-10). */
  function firstWithin(ctx, tr, actorId, p, r) {
    var t0 = tr.holdEnd, t1 = tr.end, steps = Math.max(40, Math.ceil((t1 - t0) * 240));
    var prevT = t0;
    if (dist(posAt(ctx, tr, actorId, t0), p) <= r) return t0;
    for (var i = 1; i <= steps; i++) {
      var t = t0 + (t1 - t0) * i / steps;
      if (dist(posAt(ctx, tr, actorId, Math.min(t, t1 - 1e-9)), p) <= r) {
        var lo = prevT, hi = t;
        for (var j = 0; j < 40; j++) { var mid = (lo + hi) / 2; if (dist(posAt(ctx, tr, actorId, mid), p) <= r) hi = mid; else lo = mid; }
        return hi;
      }
      prevT = t;
    }
    return null;
  }

  /** Is the holder dribbling at time t? Then the ball bounces (3D height; ACN-10). */
  function dribbleHeight(ctx, tr, actorId, t) {
    var tk = tr.tracks[actorId];
    if (!tk) return null;
    for (var i = 0; i < tk.groups.length; i++) {
      var g = tk.groups[i];
      if (t < g.t0 || t >= g.t1) continue;
      var dribbling = g.events.some(function (ev) { return ev.type === 'dribble' || ev.type === 'handoff'; });
      if (!dribbling) return null;
      var dur = g.t1 - g.t0, nb = Math.max(1, Math.round(dur / B.dribbleBounce));
      var ph = Math.abs(Math.cos(Math.PI * nb * (t - g.t0) / dur));
      return B.radius + (B.handHeight - B.radius) * ph;
    }
    return null;
  }

  function ballAt(ctx, tr, t) {
    var segs = tr.ballSegments, seg = segs[segs.length - 1];
    for (var i = 0; i < segs.length; i++) { if (t < segs[i].t1) { seg = segs[i]; break; } }
    var r = baseBall(ctx, tr, seg, t);
    if (tr.correction && t >= tr.correction.t0) {
      var c = tr.correction, w = smooth((t - c.t0) / (c.t1 - c.t0));
      var target = c.target.kind === 'held' ? heldBallAt(ctx, tr, c.target.actor, t) : c.target.p;
      var tz = c.target.kind === 'held' ? B.handHeight : B.radius;
      r = { state: 'motion', holder: null, x: r.x + (target.x - r.x) * w, y: r.y + (target.y - r.y) * w, z: r.z + (tz - r.z) * w, heightClass: 'air',
        motion: { kind: 'correction', progress: w, eventId: null } };
    }
    return r;
  }

  function baseBall(ctx, tr, seg, t) {
    var u = seg.t1 > seg.t0 ? clamp01((t - seg.t0) / (seg.t1 - seg.t0)) : 1, p, z;
    switch (seg.kind) {
      case 'held': {
        p = heldBallAt(ctx, tr, seg.actor, t);
        var dz = dribbleHeight(ctx, tr, seg.actor, t);
        return { state: 'held', holder: seg.actor, x: p.x, y: p.y, z: dz === null ? B.handHeight : dz, heightClass: dz === null ? 'hand' : 'dribble', motion: null };
      }
      case 'rest':
        return { state: 'unassigned', holder: null, x: seg.p.x, y: seg.p.y, z: B.radius, heightClass: 'floor', motion: null };
      case 'pass': {
        p = lerp(seg.from, seg.aim, u);
        var peak = Math.min(0.8, 0.08 * seg.distance);
        z = B.handHeight + peak * 4 * u * (1 - u);
        return { state: 'motion', holder: null, x: p.x, y: p.y, z: z, heightClass: 'air', motion: { kind: 'pass', progress: u, eventId: seg.eventId, from: cp(seg.from), to: cp(seg.aim) } };
      }
      case 'shot': {
        p = lerp(seg.from, seg.aim, u);
        var d = dist(seg.from, seg.aim);
        z = B.releaseHeight + (B.ringHeight - B.releaseHeight) * u + (1.0 + 0.05 * d) * 4 * u * (1 - u);
        return { state: 'motion', holder: null, x: p.x, y: p.y, z: z, heightClass: 'air', motion: { kind: 'shot', progress: u, eventId: seg.eventId, from: cp(seg.from), to: cp(seg.aim) } };
      }
      case 'drop':
        return { state: 'motion', holder: null, x: seg.at.x, y: seg.at.y, z: B.ringHeight - (B.ringHeight - B.radius) * u * u, heightClass: 'air', motion: { kind: 'drop', progress: u, eventId: seg.eventId } };
      case 'rebound': {
        var to = seg.toActor ? heldBallAt(ctx, tr, seg.toActor, t) : seg.toPoint;
        var k = P.easeOut(u);
        p = lerp(seg.from, to, k);
        var endZ = seg.toActor ? B.handHeight : B.radius;
        z = B.ringHeight + (endZ - B.ringHeight) * k + 0.6 * 4 * u * (1 - u);
        return { state: 'motion', holder: null, x: p.x, y: p.y, z: z, heightClass: 'air', motion: { kind: 'rebound', progress: u, eventId: seg.eventId, to: cp(to) } };
      }
      case 'transfer': {
        var a = heldBallAt(ctx, tr, seg.giver, t), b = heldBallAt(ctx, tr, seg.receiver, t);
        p = lerp(a, b, smooth(u));
        return { state: 'held', holder: seg.giver, x: p.x, y: p.y, z: B.handHeight, heightClass: 'hand', motion: { kind: 'handoff', progress: u, eventId: seg.eventId } };
      }
      case 'loose':
        p = lerp(seg.from, seg.to, P.easeOut(u));
        return { state: 'motion', holder: null, x: p.x, y: p.y, z: B.radius, heightClass: 'floor', motion: { kind: 'loose', progress: u, eventId: null, from: cp(seg.from), to: cp(seg.to) } };
      case 'pickup': {
        var h = heldBallAt(ctx, tr, seg.actor, t), w = smooth(u);
        p = lerp(seg.from, h, w);
        return { state: 'motion', holder: null, x: p.x, y: p.y, z: B.radius + (B.handHeight - B.radius) * w, heightClass: 'floor', motion: { kind: 'pickup', progress: u, eventId: null } };
      }
      case 'attach': {
        var hh = heldBallAt(ctx, tr, seg.actor, t), ww = smooth(u);
        p = lerp(seg.from, hh, ww);
        return { state: 'held', holder: seg.actor, x: p.x, y: p.y, z: B.radius + (B.handHeight - B.radius) * ww, heightClass: 'hand', motion: { kind: 'pickup', progress: u, eventId: null } };
      }
      case 'putdown': {
        var hp = heldBallAt(ctx, tr, seg.actor, t), w2 = smooth(u);
        p = lerp(hp, seg.to, w2);
        return { state: 'motion', holder: null, x: p.x, y: p.y, z: B.handHeight + (B.radius - B.handHeight) * w2, heightClass: 'floor', motion: { kind: 'putdown', progress: u, eventId: null } };
      }
    }
    throw new Error('Unknown ball segment: ' + seg.kind);
  }

  function staticBall(ctx, state, positions) {
    if (state.kind === 'held') {
      var p = heldOffsetPoint(positions[state.actor]);
      return { state: 'held', holder: state.actor, x: p.x, y: p.y, z: B.handHeight, heightClass: 'hand', motion: null };
    }
    return { state: 'unassigned', holder: null, x: state.p.x, y: state.p.y, z: B.radius, heightClass: 'floor', motion: null };
  }

  /* ---------------------------------------------------------------- */
  /* Drawables: the action symbols of each step (05-actions.md)        */
  /* ---------------------------------------------------------------- */

  function buildDrawables(ctx, k, tr) {
    var play = ctx.play, step = play.steps[k], amap = ctx.amap, out = [];
    if (!tr) return Object.freeze(out);
    tr.events.forEach(function (x) {
      var e = x.event, a = amap[e.actor];
      var base = { eventId: e.id, type: e.type, actor: e.actor, actorKind: a.kind, visible: S.isVisible(play, step, a), target: e.target || null };
      var tk = tr.tracks[e.actor], g = null, ev = null;
      if (tk) tk.groups.forEach(function (gr) { gr.events.forEach(function (it) { if (it.id === e.id) { g = gr; ev = it; } }); });
      var p0 = cp(step.pos[e.actor]);
      if (ev) {
        var moved = ev.path.length > SAME;
        base.fromStepPosition = ev.s0 === 0 && g === tk.groups[0];
        if (e.type === 'screen' && !moved) {
          out.push(Object.assign(base, { stationary: true, at: ev.path.end, barDirection: screenBar(ctx, tr, e, ev.path.end) }));
          return;
        }
        if (e.type === 'handoff' && !moved) {
          var rp = cp(step.pos[e.target]);
          out.push(Object.assign(base, { stationary: true, at: lerp(p0, rp, 0.5), barDirection: vec.unit(vec.sub(rp, p0)) || pt(0, -1) }));
          return;
        }
        out.push(Object.assign(base, { stationary: false, samples: P.sample(ev.path, 0.1, 8), start: cp(ev.path.start), end: cp(ev.path.end), endTangent: ev.path.endTangent, length: ev.path.length }));
        return;
      }
      if (e.type === 'screen' || e.type === 'handoff') {
        // A screen without an end point is set where the screener stands (ACN-12).
        var at = cp(p0);
        var dir = e.type === 'screen' ? screenBar(ctx, tr, e, at) : vec.unit(vec.sub(cp(step.pos[e.target]), p0)) || pt(0, -1);
        out.push(Object.assign(base, { stationary: true, at: e.type === 'handoff' ? lerp(p0, cp(step.pos[e.target]), 0.5) : at, barDirection: dir }));
        return;
      }
      if (e.type === 'pass') {
        var to = e.target ? posAt(ctx, tr, e.target, tr.end) : cp(e.to);
        out.push(Object.assign(base, { from: p0, to: to, toActor: e.target || null, ignored: (tr.ballNotes || []).some(function (b) { return b.eventId === e.id; }) }));
        return;
      }
      if (e.type === 'shot') {
        var basket = G.basketFor(ctx.court, p0);
        var bp = pt(basket.x, basket.y);
        var u = vec.unit(vec.sub(bp, p0)) || pt(0, -1);
        var rim = G.COURT.ringInnerDiameter / 2;
        var shot = (tr.shots || []).filter(function (s) { return s.eventId === e.id; })[0];
        out.push(Object.assign(base, { from: p0, to: pt(bp.x - u.x * rim, bp.y - u.y * rim), basket: bp, outcome: e.outcome || 'unspecified', ignored: !shot }));
      }
    });
    // Loose ball travelling between two unassigned positions: a dotted line during the hold (BAL-09).
    (tr.ballSegments || []).forEach(function (sg) {
      if (sg.kind === 'loose') out.push({ eventId: null, type: 'ball-travel', actor: null, actorKind: null, visible: true, from: cp(sg.from), to: cp(sg.to) });
    });
    // Editing guides (PTH-11, ACT-15): only drawn when a renderer is asked for guides.
    Object.keys(tr.tracks).forEach(function (id) {
      tr.tracks[id].groups.forEach(function (g) {
        if (g.untracked) out.push({ eventId: null, type: 'guide', guide: 'untracked', actor: id, actorKind: amap[id].kind, visible: S.isVisible(play, step, amap[id]), samples: P.sample(g.path, 0.15, 4) });
        else if (g.contFrom !== undefined) {
          var c = g.parts[g.parts.length - 1];
          out.push({ eventId: null, type: 'guide', guide: 'continuation', actor: id, actorKind: amap[id].kind, visible: S.isVisible(play, step, amap[id]), samples: P.sample(c, 0.15, 4) });
        }
      });
    });
    return Object.freeze(out.map(deepFreeze));
  }

  /** Direction of a screen's bar: perpendicular to the screener's travel, or to the target or basket (ACN-11, ACN-12). */
  function screenBar(ctx, tr, e, at) {
    var tk = tr.tracks[e.actor], dir = null;
    tk.groups.forEach(function (g) { g.events.forEach(function (ev) { if (ev.id === e.id && ev.path.length > SAME) dir = ev.path.endTangent; }); });
    if (!dir) {
      var aim = e.target ? cp(ctx.play.steps[tr.index].pos[e.target]) : G.basketFor(ctx.court, at);
      dir = vec.unit(vec.sub(pt(aim.x, aim.y), at)) || pt(0, -1);
    }
    return pt(-dir.y, dir.x); // the bar runs across the direction
  }

  /* ---------------------------------------------------------------- */
  /* Frames                                                            */
  /* ---------------------------------------------------------------- */

  function transitionAt(compiled, t) {
    var trs = compiled.transitions, lo = 0, hi = trs.length - 1;
    if (!trs.length || t >= trs[hi].end) return null;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (trs[mid].start <= t) lo = mid; else hi = mid - 1; }
    return trs[lo];
  }

  /**
   * The complete frame at timeline time t (seconds at normal speed). A pure function of the
   * compiled play and t: the same t always gives the same frame, whatever was evaluated before
   * (STP-14, STP-16). See docs/engine/frame-contract.md.
   */
  function frameAt(ctx, compiled, tIn) {
    var t = typeof tIn === 'number' && isFinite(tIn) ? Math.min(Math.max(tIn, 0), compiled.total) : 0;
    var play = ctx.play, steps = play.steps, n = steps.length;
    var tr = transitionAt(compiled, t);
    var stepIndex, phase, phaseProgress, moveProgress, stepStart, stepEnd, step, positions = {}, info = {};
    if (tr) {
      stepIndex = tr.index; step = steps[stepIndex];
      phase = t < tr.holdEnd ? 'hold' : 'move';
      stepStart = tr.start; stepEnd = tr.end;
      moveProgress = phase === 'move' ? clamp01((t - tr.holdEnd) / tr.move) : 0;
      phaseProgress = phase === 'hold' ? (ctx.timing.hold > 0 ? clamp01((t - tr.start) / ctx.timing.hold) : 1) : moveProgress;
      play.actors.forEach(function (a) {
        var s = trackAt(ctx, tr.tracks[a.id], t);
        positions[a.id] = pt(s.x, s.y);
        info[a.id] = s;
      });
    } else {
      stepIndex = n - 1; step = steps[stepIndex]; phase = 'final';
      stepStart = compiled.finalStart; stepEnd = compiled.total;
      moveProgress = 0;
      phaseProgress = compiled.total > compiled.finalStart ? clamp01((t - compiled.finalStart) / (compiled.total - compiled.finalStart)) : 1;
      play.actors.forEach(function (a) { positions[a.id] = cp(compiled._final.positions[a.id]); info[a.id] = { speed: 0, tangent: null, group: null }; });
    }
    var ball = tr ? ballAt(ctx, tr, t) : staticBall(ctx, compiled._final.ball, positions);
    var endsWithTransition = compiled.transitions.length > 0 && compiled.transitions[compiled.transitions.length - 1].final;
    var ballPos = pt(ball.x, ball.y);

    var actors = play.actors.map(function (a) {
      var p = positions[a.id], s = info[a.id];
      var visible = S.isVisible(play, step, a);
      // A stored facing applies to its own step; the end state after a final transition has none.
      var stored = (tr || !endsWithTransition) && step.pos[a.id] && typeof step.pos[a.id].facing === 'number' ? step.pos[a.id].facing : null;
      // Facing (ACT-13): a stored facing, otherwise towards the ball, or the basket when the actor holds it;
      // blended smoothly into the direction of travel while moving.
      var rest;
      if (stored !== null) rest = stored;
      else {
        var aim = (ball.holder === a.id || dist(p, ballPos) < 0.05) ? G.basketFor(ctx.court, p) : ballPos;
        rest = dist(p, aim) < 1e-6 ? 0 : facingOf(aim.x - p.x, aim.y - p.y);
      }
      var facing = rest;
      if (s.tangent && s.speed > 0) facing = blendAngle(rest, facingOf(s.tangent.x, s.tangent.y), clamp01(s.speed / 0.6));
      return { id: a.id, kind: a.kind, label: a.label, x: p.x, y: p.y, facing: facing, visible: visible, moving: s.speed > 0.01, speed: s.speed || 0 };
    });

    var actions = [];
    if (tr) {
      tr.events.forEach(function (x) {
        var e = x.event, start, end, progress, mv = movingEvent(tr, e);
        if (e.type === 'pass' && x.ball) { start = x.ball.release; end = x.ball.catch; }
        else if (e.type === 'shot' && x.ball) { start = x.ball.release; end = x.ball.arrive; }
        else if (mv) { start = mv.t0; end = (x.ball && x.ball.transfer !== undefined) ? Math.max(mv.t1, x.ball.transfer) : mv.t1; }
        else if (e.type === 'handoff' && x.ball) { start = x.ball.transfer - ctx.timing.handoffTransfer; end = x.ball.transfer; }
        else { start = x.start; end = tr.end; }
        if (t < start) progress = 0;
        else if (t >= end) progress = 1;
        else progress = end > start ? (t - start) / (end - start) : 1;
        actions.push({ eventId: e.id, type: e.type, actor: e.actor, target: e.target || null, start: start, end: end, progress: progress, status: t < start ? 'pending' : (t >= end ? 'done' : 'active') });
      });
    }

    var shots = [];
    compiled.transitions.forEach(function (trx) {
      (trx.shots || []).forEach(function (s) {
        var inStep = t >= trx.start && (t < trx.end || (trx.final && t <= compiled.total));
        if (!inStep) return;
        shots.push({ eventId: s.eventId, actor: s.actor, outcome: s.outcome, basket: cp(s.basket), release: s.release, arrive: s.arrive,
          phase: t < s.release ? 'pending' : (t < s.arrive ? 'flight' : 'arrived'),
          markerVisible: (s.outcome === 'made' || s.outcome === 'missed') && t >= s.arrive });
      });
    });

    return {
      t: t,
      total: compiled.total,
      stepIndex: stepIndex,
      stepId: step.id,
      stepCount: n,
      transitionIndex: tr ? tr.index : null,
      phase: phase,
      phaseProgress: phaseProgress,
      moveProgress: moveProgress,
      stepStart: stepStart,
      stepEnd: stepEnd,
      note: step.note || '',
      actionOpacity: phase === 'hold' ? 1 : (phase === 'move' ? 1 - moveProgress : 0),
      actors: actors,
      ball: ball,
      actions: actions,
      shots: shots
    };
  }

  function movingEvent(tr, e) {
    var tk = tr.tracks[e.actor], found = null;

  /* ---------------------------------------------------------------- */
  /* Validation of stored and restored records (every read)            */
  /* ---------------------------------------------------------------- */

  function cleanCategory(r, c, path) {
    if (c === null || c === undefined) return null;
    if (!S.isPlainObject(c)) { r.warn('W_CATEGORY', path, 'A damaged category was removed; the play is listed as uncategorised.'); return null; }
    var name = V.text(r, c.name, path + '.name', L.nameChars, 'name', false);
    if (!name) { r.warn('W_CATEGORY', path, 'A category without a name was removed; the play is listed as uncategorised.'); return null; }
    var id = S.isValidId(c.id) ? c.id : null;
    var order = typeof c.order === 'number' && isFinite(c.order) && c.order >= 0 ? Math.min(9999, Math.floor(c.order)) : 9999;
    return { id: id, name: name, order: order };
  }

  /** One saved play record, checked and rebuilt field by field. Returns the clean item or null. */
  function cleanItem(r, raw, path) {
    if (!S.isPlainObject(raw)) { r.warn('W_ITEM', path, 'A damaged saved play was left out.'); return null; }
    Object.keys(raw).forEach(function (k) { if (ITEM_FIELDS.indexOf(k) < 0) r.warn('W_UNKNOWN_FIELD', path + '.' + k, 'Unrecognised information was left out.'); });
    var pv = V.play(raw.play, { context: 'share' });
    if (!pv.ok) { r.warn('W_ITEM_INVALID', path, 'A saved play could not be read and was left out (' + pv.errors[0].message + ').'); return null; }
    pv.warnings.forEach(function (w) { r.add('info', w.code, path + '.play' + w.path, w.message); });
    var item = {
      rid: S.isValidId(raw.rid) ? raw.rid : newRid(),
      teamName: V.text(r, raw.teamName, path + '.teamName', L.nameChars, 'name', false),
      category: cleanCategory(r, raw.category, path + '.category'),
      play: pv.value,
      receivedAt: isoOrNull(raw.receivedAt),
      localName: V.text(r, raw.localName, path + '.localName', L.nameChars, 'name', false),
      packId: S.isValidId(raw.packId) ? raw.packId : null,
      source: { kind: 'code', label: '' }
    };
    if (S.isPlainObject(raw.source)) {
      item.source = { kind: SOURCE_KINDS.indexOf(raw.source.kind) >= 0 ? raw.source.kind : 'code', label: V.text(r, raw.source.label, path + '.source.label', L.nameChars, 'name', false) };
    }
    item.play.categoryId = item.category && item.category.id ? item.category.id : null;
    return item;
  }

  function cleanPack(r, raw, path) {
    if (!S.isPlainObject(raw) || !S.isValidId(raw.id)) return null;
    Object.keys(raw).forEach(function (k) { if (PACK_FIELDS.indexOf(k) < 0) r.warn('W_UNKNOWN_FIELD', path + '.' + k, 'Unrecognised information was left out.'); });
    return {
      id: raw.id,
      kind: SOURCE_KINDS.indexOf(raw.kind) >= 0 ? raw.kind : 'code',

      teamName: V.text(r, raw.teamName, path + '.teamName', L.nameChars, 'name', false),

  }

  /**
   * Validate a library or backup body {items, packs}: dangerous keys, roster-shaped fields,
   * counts and every play. Returns {ok, items, packs, warnings, info} or an error. Nothing is
   * stored.
   */
  function cleanBody(data, what) {
    var bad = V.findDangerousKey(data, '$', 0);
    if (bad) return err('E_DANGEROUS_KEY', what + ' contains a field name that is not allowed (' + bad + ').');
    var leak = V.findRosterField(data, '$', 0);
    if (leak) return err('E_ROSTER_FIELD', what + ' contains roster information (' + leak + '), which the Players App never stores. Nothing was changed.');
    if (!S.isPlainObject(data) || !Array.isArray(data.items)) return err('E_STRUCTURE', what + ' does not contain saved plays.');
    if (data.items.length > LIMITS.plays) return err('E_TOO_MANY', what + ' holds more than ' + LIMITS.plays + ' plays, the most the Players App keeps.');
    var r = new V.Report(), items = [], packs = [], rids = {};

    var packIds = {};
    (Array.isArray(data.packs) ? data.packs : []).slice(0, LIMITS.plays).forEach(function (raw, i) {
      var p = cleanPack(r, raw, '.packs[' + i + ']');

    });
    items.forEach(function (it) { if (it.packId && !packIds[it.packId]) it.packId = null; });

    items.forEach(function (it) { if (it.packId) used[it.packId] = true; });
    packs = packs.filter(function (p) { return used[p.id]; });

  /* ---------------------------------------------------------------- */
  /* Library state                                                      */
  /* ---------------------------------------------------------------- */

  function empty() { return { items: [], packs: [] }; }

  function documentOf(lib, now) {
    return { format: FORMAT, v: VERSION, savedAt: now || new Date().toISOString(), items: lib.items, packs: lib.packs };
  }

  /** Load the saved library. A damaged record is never overwritten silently: the caller is told. */
  function load(store) {
    var r = store.read('library');
    if (!r.ok) return { ok: false, damaged: true, error: r.error, library: empty() };
    if (r.value === null) return { ok: true, library: empty(), warnings: [], fresh: true };
    var d = r.value;
    if (!S.isPlainObject(d) || d.format !== FORMAT) return { ok: false, damaged: true, error: { code: 'E_NOT_LIBRARY', message: 'The saved plays on this device are not in a format this app can read.' }, library: empty() };
    if (typeof d.v === 'number' && d.v > VERSION) return { ok: false, damaged: false, newer: true, error: { code: 'E_VERSION_NEWER', message: 'Your saved plays were last saved by a newer version of this app. Open them with that version, or back them up there first.' }, library: empty() };
    var body = cleanBody(d, 'The saved library');
    if (!body.ok) return { ok: false, damaged: true, error: body.error, library: empty() };
    return { ok: true, library: { items: body.items, packs: body.packs }, warnings: body.warnings, savedAt: isoOrNull(d.savedAt) };
  }

  /** Size and count checks for a library about to be saved. */
  function checkLimits(lib) {

    var chars = JSON.stringify(documentOf(lib, '2000-01-01T00:00:00.000Z')).length;
    if (chars > LIMITS.chars) return err('E_TOO_LARGE', 'Your saved plays would be larger than the 3 MB the Players App keeps. Delete some plays first.', { chars: chars });
    return { ok: true, chars: chars };
  }

  /**
   * Save the library: limits, then one whole-record write checked by reading it back

  /* ---------------------------------------------------------------- */
  /* Organisation, search, filters and sorting                          */
  /* ---------------------------------------------------------------- */

  var NO_TEAM = '';

  function categoryKey(it) { return it.category ? (it.category.id ? 'i:' + it.category.id : 'n:' + it.category.name.toLowerCase()) : ''; }
  function displayName(it) { return it.localName || it.play.name || 'Untitled play'; }

  function compareText(a, b) { return String(a).localeCompare(String(b), 'en-AU', { sensitivity: 'base', numeric: true }); }

  /** Teams with their categories, as the coach supplied them (category order first). */
  function teams(lib) {
    var map = {}, list = [];
    lib.items.forEach(function (it) {
      var k = teamKey(it);
      if (!map[k]) { map[k] = { key: k, name: it.teamName, count: 0, cats: {}, categories: [] }; list.push(map[k]); }
      var t = map[k]; t.count++;
      var ck = categoryKey(it);
      if (!t.cats[ck]) { t.cats[ck] = { key: ck, id: it.category ? it.category.id : null, name: it.category ? it.category.name : '', order: it.category ? it.category.order : 1e9, count: 0 }; t.categories.push(t.cats[ck]); }
      t.cats[ck].count++;
    });
    list.forEach(function (t) {
      t.categories.sort(function (a, b) { return (a.order - b.order) || compareText(a.name, b.name); });
      delete t.cats;
    });
    list.sort(function (a, b) { if (!a.name !== !b.name) return a.name ? -1 : 1; return compareText(a.name, b.name); });
    return list;
  }

  /** Category names across the chosen team (or all teams), for the filter chips. */
  function categoryFilters(lib, team) {

    teams(lib).forEach(function (t) {
      if (team !== '*' && team !== undefined && t.key !== team) return;
      t.categories.forEach(function (c) {
        var k = c.key === '' ? '' : 'n:' + c.name.toLowerCase();
        if (!seen[k]) { seen[k] = { key: k, name: c.name, order: c.order, count: 0 }; out.push(seen[k]); }
        seen[k].count += c.count;
        seen[k].order = Math.min(seen[k].order, c.order);

  function norm(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, ''); }

  /**
   * Plays matching the search, team and category filters, sorted.
   * q: {search, team ('*' for all teams, '' for plays without a team name), category ('*', '' for
   * uncategorised or 'n:<name>'), sort ('category' | 'name' | 'recent')}
   */
  function query(lib, q) {
    q = q || {};
    var words = norm(q.search).split(/\s+/).filter(Boolean);
    var team = q.team === undefined ? '*' : q.team, cat = q.category === undefined ? '*' : q.category;
    var out = lib.items.filter(function (it) {
      if (team !== '*' && teamKey(it) !== team) return false;
      if (cat !== '*') {
        var ck = it.category ? 'n:' + it.category.name.toLowerCase() : '';
        if (ck !== cat) return false;
      }
      if (!words.length) return true;
      var hay = norm([displayName(it), it.play.name, it.category ? it.category.name : '', it.teamName].join(' '));
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    });
    var sort = q.sort || 'category';
    out.sort(function (a, b) {
      if (sort === 'recent') return compareText(b.receivedAt || '', a.receivedAt || '') || compareText(displayName(a), displayName(b));
      if (sort === 'name') return compareText(displayName(a), displayName(b)) || compareText(a.teamName, b.teamName);
      // Coach's structure: team, category order, then name.
      if (!a.teamName !== !b.teamName) return a.teamName ? -1 : 1;
      var t = compareText(a.teamName, b.teamName); if (t) return t;
      var ao = a.category ? a.category.order : 1e9, bo = b.category ? b.category.order : 1e9;

  function find(lib, rid) { for (var i = 0; i < lib.items.length; i++) if (lib.items[i].rid === rid) return lib.items[i]; return null; }

  function copyLib(lib) { return { items: lib.items.slice(), packs: lib.packs.slice() }; }

  /** Change a play's local display name (empty restores the original). The play itself never changes. */
  function rename(lib, rid, name) {
    var it = find(lib, rid);
    if (!it) return err('E_NOT_FOUND', 'That play is no longer saved.');
    var r = new V.Report();
    var clean = V.text(r, typeof name === 'string' ? name : '', '.name', L.nameChars, 'name', false).trim();
    var next = copyLib(lib);
    next.items = next.items.map(function (x) {
      if (x.rid !== rid) return x;
      var y = {}; Object.keys(x).forEach(function (k) { y[k] = x[k]; });
      y.localName = clean === x.play.name ? '' : clean;
      return y;
    });

  }

  /** Remove plays by record id; packs left with no plays are removed too. */
  function removeItems(lib, rids) {
    var set = {}; rids.forEach(function (r) { set[r] = true; });
    var next = copyLib(lib);
    next.items = lib.items.filter(function (it) { return !set[it.rid]; });
    var used = {}; next.items.forEach(function (it) { if (it.packId) used[it.packId] = true; });
    next.packs = lib.packs.filter(function (p) { return used[p.id]; });
    return { ok: true, library: next, removed: lib.items.length - next.items.length };
  }

  /** Record ids for deletion scopes: one team, one category within a team, or one received pack. */
  function ridsFor(lib, scope) {
    return lib.items.filter(function (it) {
      if (scope.kind === 'team') return teamKey(it) === scope.team;
      if (scope.kind === 'category') return teamKey(it) === scope.team && categoryKey(it) === scope.category;
      if (scope.kind === 'pack') return it.packId === scope.packId;
      return false;
    }).map(function (it) { return it.rid; });
  }

  /* ---------------------------------------------------------------- */
  /* Receiving: planning and applying (spec 8.5, 6.8 "Result")          */
  /* ---------------------------------------------------------------- */

  function sameCategory(a, b) {
    if (!a || !b) return !a && !b;
    return (a.id || '') === (b.id || '') && a.name === b.name;
  }

  /**
   * Plan what saving a received batch would do. batch: {teamName, categories, plays} from the
   * shared decoders (already validated). Every play is checked again in share context (which
   * drops source, legacy and Resources blocks and uses canonical labels) and against the saved
   * library: 'new', 'duplicate' (same id and identical content, team and category: skipped by
   * default) or 'conflict' (same id, different content: kept as a second copy by default,
   * never replaced without a choice). Nothing is changed.
   */
  function planImport(lib, batch) {
    var catMap = {};
    (batch.categories || []).forEach(function (c) { catMap[c.id] = { id: c.id, name: c.name, order: c.order }; });
    var r = new V.Report(), entries = [];
    (batch.plays || []).forEach(function (p, i) {
      var pv = V.play(p, { context: 'share' });
      if (!pv.ok) { r.error('E_INVALID', '.plays[' + i + ']', pv.errors[0].message); return; }
      pv.warnings.forEach(function (w) { r.warn(w.code, '.plays[' + i + ']' + w.path, w.message); });
      var play = pv.value;
      var category = play.categoryId && catMap[play.categoryId] ? catMap[play.categoryId] : null;
      if (play.categoryId && !category) play.categoryId = null;
      var teamName = batch.teamName || '';

      var status = 'new', existing = null;
      if (matches.length) {

        if (same.length) { status = 'duplicate'; existing = same[0].rid; }
        else {

      entries.push({ index: i, play: play, category: category, teamName: teamName, status: status, existing: existing,
        action: status === 'new' ? 'add' : (status === 'duplicate' ? 'skip' : 'keep-both') });
    });
    var res = r.result(null);
    var counts = { total: entries.length, add: 0, duplicate: 0, conflict: 0 };
    entries.forEach(function (e) { counts[e.status === 'new' ? 'add' : e.status]++; });
    if (res.errors.length) return err('E_INVALID', res.errors[0].message, { errors: res.errors });
    return { ok: true, entries: entries, counts: counts, warnings: res.warnings, info: res.info };
  }

  function uniqueCopyName(lib, base) {
    var names = {}; lib.items.forEach(function (it) { names[displayName(it).toLowerCase()] = true; });
    // Decision S3-P6: "(2)", "(3)" and so on; a long name is shortened so the number is always kept. Only the local
    // display name is set; the received play itself is never changed.
    for (var n = 2; n <= 1000; n++) {

    }
    return base + ' (' + Date.now() + ')';
  }

  /**

  function applyImport(lib, plan, meta) {

    plan.entries.forEach(function (e) {
      var action = e.status === 'new' ? 'add' : e.action;

        source: { kind: SOURCE_KINDS.indexOf(meta.kind) >= 0 ? meta.kind : 'code', label: String(meta.label || '').slice(0, L.nameChars) } };
      item.play.categoryId = e.category && e.category.id ? e.category.id : null;
      if (action === 'skip') { summary.skipped++; return; }
      if (action === 'replace' && e.existing) {

    }

  /* ---------------------------------------------------------------- */
  /* Backup file (spec 5.2 P14)                                         */
  /* ---------------------------------------------------------------- */

  function checksumOf(body) { var c = S.canonicalJson(body); return { alg: 'crc32', value: PB.storage.crc32(c), length: c.length }; }

  /** Backup of the saved plays and preferences. Never contains roster or team data (there is none). */
  function writeBackup(lib, prefs, info) {
    info = info || {};
    var body = { items: lib.items, packs: lib.packs, prefs: prefs || {} };
    var doc = { app: 'playbook-player', format: BACKUP_FORMAT, v: VERSION, created: info.now || new Date().toISOString(),
      appVersion: String(info.version || ''), items: body.items, packs: body.packs, prefs: body.prefs, checksum: checksumOf(body) };
    var text = JSON.stringify(doc);
    var day = doc.created.slice(0, 10);
    return { ok: true, text: text, fileName: 'playbook-player-backup-' + day + '.json', count: lib.items.length };
  }

  /**
   * Read and completely validate a backup file before anything is replaced: size, safe parsing,
   * format and version, integrity check, roster check, counts and every play. Returns
   * {ok, items, packs, prefs, created, warnings, info} or an error. Nothing is stored.
   */
  function readBackup(text) {
    if (typeof text !== 'string') return err('E_NOT_TEXT', 'The backup file could not be read as text.');
    if (text.length > L.backupBytes) return err('E_TOO_LARGE', 'This file is larger than 10 MB and is not a Players App backup.');
    var parsed = V.parseJson(text, { maxChars: L.backupBytes, what: 'The backup file' });
    if (!parsed.ok) return { ok: false, error: parsed.error };
    var d = parsed.value;
    if (S.isPlainObject(d) && d.app === 'playbook' && (d.v === 3 || d.v === 4)) return err('E_COACHES_BACKUP', 'This is a Coaches App backup. The Players App cannot restore it; ask your coach for a Play Pack file instead.');
    if (S.isPlainObject(d) && d.format === 'playbook-pack') return err('E_IS_PACK', 'This is a Play Pack file, not a backup. Open it from the Import screen.');
    if (!S.isPlainObject(d) || d.app !== 'playbook-player' || d.format !== BACKUP_FORMAT) return err('E_NOT_BACKUP', 'This file is not a Players App backup.');
    if (typeof d.v === 'number' && d.v > VERSION) return err('E_VERSION_NEWER', 'This backup was made by a newer version of the Players App. Update the app to restore it.');
    if (d.v !== VERSION) return err('E_VERSION', 'This backup version is not supported.');
    if (!S.isPlainObject(d.checksum) || d.checksum.alg !== 'crc32') return err('E_CHECKSUM', 'The backup has no integrity check, so it may be incomplete. Nothing was restored.');

    Object.keys(d).forEach(function (k) { if (['app', 'format', 'v', 'created', 'appVersion', 'items', 'packs', 'prefs', 'checksum'].indexOf(k) < 0) r.warn('W_UNKNOWN_FIELD', '.' + k, 'Unrecognised information in the backup was left out.'); });
    var res = r.result(null);
    return { ok: true, items: cleaned.items, packs: cleaned.packs, prefs: PB.playersPrefs.clean(d.prefs), created: isoOrNull(d.created),
      warnings: cleaned.warnings.concat(res.warnings), info: cleaned.info };
  }

  /**
   * What restoring would do. mode 'replace': the backup becomes the library. mode 'add': each
   * play is planned like a received play (duplicates skipped, conflicts kept as second copies

  function planRestore(lib, backup, mode) {
    if (mode === 'replace') {

    }
    var next = copyLib(lib), summary = { added: 0, skipped: 0, keptBoth: 0 };

  function storageText(mode) {
    if (mode === 'full') return 'This device’s storage is full. Your saved plays were loaded, but new changes may not save. Back up, then delete plays or recovery copies you no longer need.';
    if (mode === 'read-only') return 'Your saved plays were loaded, but this browser is not letting the app save changes on this device. Changes you make last only until this page is closed. Back up to keep them.';
    if (mode === 'memory') return 'This browser is not letting the app read or save plays on this device (for example when storage is blocked). Plays you import stay only until this page is closed. Back up to keep them.';
    return 'Saved in this browser on this device.';
  }

  function context() {
    return {
      lib: function () { return lib; }, prefs: function () { return prefs; }, meta: function () { return meta; }, store: function () { return store; },
      commit: commit, setPref: setPref, applyPrefs: applyPrefs, go: go, openPlay: openPlay, closePlayIf: closePlayIf, refreshList: refreshList,
      selectedRid: function () { return selectedRid; }, backupNow: backupNow, downloadApp: downloadApp,
      reminderDue: function () { return Lib.reminderDue(meta, lib.items.length); },
      dismissReminder: function () { meta = Lib.dismissReminder(meta); store.write('meta', meta); refreshList(); },
      refreshBanners: function () { refreshBanners(); }, storageText: storageText, choose: choose // added at Stage 3 r2
    };
  }

  /* ---------------------------------------------------------------- */
  /* Links that open the app with a play (spec 5.2 P2)                  */
  /* ---------------------------------------------------------------- */

  function handleIncoming() {
    var h = Rx.fromHash(location.hash);
    if (!h) return false;
    // Remove the play from the address so a reload does not offer it again. Nothing is navigated to.
    try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    if (!h.ok) { go('import', { error: h.error.message }); return true; }
    var b = Rx.fromText(h.text, 'link');
    if (!b.ok) { go('import', { error: 'The link you opened does not hold a play the app can read: ' + b.error.message }); return true; }
    go('import');
    PB.playersImportView.preview(context(), b);
    return true;
  }

  /* ---------------------------------------------------------------- */
  /* Start                                                              */
  /* ---------------------------------------------------------------- */

  function start() {
    store = PB.storage.create({ prefix: 'pbp4:' });
    prefs = Pr.load(store);
    var m = store.read('meta');
    meta = Lib.cleanMeta(m.ok ? m.value : null);
    var l = Lib.load(store);
    lib = l.library;
    if (!l.ok) {
      loadState = l.newer ? 'newer' : 'damaged'; loadError = l.error;
      // Keep the unreadable data: a recovery copy when there is room; otherwise it is left in place and
      // the app asks before anything replaces it (commit). It is never silently initialised over.
      if (loadState === 'damaged') damagedKept = !!(store.durable() && store.snapshot('library', 'saved plays that could not be read when the app opened').ok);
    }
    darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    wideMq = window.matchMedia ? window.matchMedia('(min-width: 900px)') : null;
    applyTheme();
    if (darkMq && darkMq.addEventListener) darkMq.addEventListener('change', function () { if (prefs.theme === 'system') applyTheme(); });

    root = document.getElementById('app');
    root.className = 'pa';
    root.removeAttribute('aria-live');
    var live = el('div', { class: 'visually-hidden', 'aria-live': 'polite', 'aria-atomic': 'true' });
    U.setLiveRegion(live);
    topNav = navButtons('pa-nav-top');
    bottomNav = navButtons('pa-nav-bottom');
    var header = el('header', { class: 'pa-top' },
      el('div', { class: 'pa-brand' }, el('span', { class: 'pa-brand-name', text: 'PLAYBOOK' }), el('span', { class: 'pa-brand-ed', text: 'PLAYER EDITION' })),
      topNav);
    banners = el('div', { class: 'pa-banners' });
    main = el('main', { class: 'pa-main', id: 'main', tabindex: '-1' });
    [el('a', { class: 'skip-link', href: '#main' }, 'Skip to content'), header, banners, main, bottomNav, el('div', { class: 'pa-notices', 'aria-live': 'off' }), live]
      .forEach(function (part) { root.appendChild(part); });

    if (wideMq && wideMq.addEventListener) wideMq.addEventListener('change', function () {
      if (!isWide() && selectedRid && viewer && screen === 'list') screen = 'play';
      rerender();
    });
    window.addEventListener('popstate', function (e) {
      var st = e.state || { pa: 'list' };
      if (st.pa === 'play' && st.rid && Lib.find(lib, st.rid)) { openPlay(st.rid, { push: false }); return; }
      go(st.pa === 'play' ? 'list' : (st.pa || 'list'), { push: false });
    });
    window.addEventListener('hashchange', function () { handleIncoming(); });
    window.addEventListener('storage', function (e) {
      if (!e.key || e.key.indexOf(store.prefix) !== 0 || e.key === store.prefix + 'library' && document.querySelector('.dlg-scrim')) return;
      if (e.key === store.prefix + 'library') {
        var again = Lib.load(store);
        if (again.ok) { lib = again.library; if (selectedRid && !Lib.find(lib, selectedRid)) closeViewer(); rerender(); U.notice('Saved plays were changed in another window.', 'info'); }
      }
    });

    try { history.replaceState({ pa: 'list' }, ''); } catch (e) { /* ignore */ }
    refreshBanners();
    if (!handleIncoming()) go('list', { push: false });
    markNav();
    document.documentElement.setAttribute('data-ready', 'true');
  }

  /** Read-only hooks for automated tests and support (no access to anything not already on screen). */
  PB.playersApp = Object.freeze({
    state: function () { return { screen: screen, selectedRid: selectedRid, layout: isWide() ? 'wide' : 'phone', storageMode: store.mode(), loadState: loadState, damagedKept: damagedKept, plays: lib.items.length, theme: document.documentElement.getAttribute('data-theme'), prefs: Pr.clean(prefs) }; },
    viewer: function () { return viewer ? { state: viewer.state(), frame: viewer.frame(), layout: viewer.layout(), item: viewer.item() ? viewer.item().rid : null } : null; },
    library: function () { return JSON.parse(JSON.stringify(lib)); },
    originalLength: function () { return ORIGINAL.length; }
  });

  start();
})(window.PB);
</script>
</body>
</html>
