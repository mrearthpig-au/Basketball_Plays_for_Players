.th :focus-visible{outline:3px solid #F2B100;outline-offset:2px}
.disp{font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;letter-spacing:.01em}
.hdr{background:var(--ink);color:#fff;padding:18px 20px 14px;border-bottom:6px solid var(--accent)}
.hdr-in{max-width:1080px;margin:0 auto;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hdr h1{margin:0;font-size:44px;line-height:1;font-weight:700}
.hdr .next{margin-top:6px;color:#C3CED5;font-size:14px}
.coachbtn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid #5C7280;color:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}
.coachbtn.on{background:#F2B100;border-color:#F2B100;color:#13222B;font-weight:600}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav-in{max-width:1080px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 8px;background:none;border:0;border-bottom:4px solid transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.status{max-width:1080px;margin:0 auto;padding:8px 16px 0;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:flex-end}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:16px}
.seg button{background:#fff;border:0;padding:8px 16px;cursor:pointer;font-weight:600}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dng{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:14px}
.icon{background:none;border:0;cursor:pointer;padding:6px;border-radius:6px;display:inline-flex;color:var(--muted)}
.icon:hover{background:#EEF1F3;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{border-collapse:collapse;width:100%;min-width:640px}
.t th,.t td{padding:10px 8px;text-align:right;border-bottom:1px solid #E3E8EB;white-space:nowrap}
.t th{font-weight:600;font-size:13px;color:var(--muted);background:#F6F8F9;cursor:pointer;user-select:none}
.t th.l,.t td.l{text-align:left}
.t td.l{position:sticky;left:0;background:#fff;z-index:1;min-width:150px}
.t th.l{position:sticky;left:0;z-index:2}
.t td.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px;font-weight:600}
.t td.lead{color:var(--accent);font-weight:700}
.t tr.tot td{background:#F6F8F9;font-weight:600}
.pn{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 6px;border-radius:6px;background:var(--accent);color:#fff;margin-right:8px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:17px;font-weight:700}
.step{display:inline-flex;align-items:center;gap:2px}
.step button{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.step button:hover{border-color:var(--ink)}
.step b{min-width:26px;text-align:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px}
.step .q{width:auto;padding:0 6px;font-size:13px}
/* schedule */
.ev{display:flex;gap:14px;padding:14px;border-left:6px solid var(--accent);align-items:stretch}
.ev+.ev{margin-top:10px}
.evd{min-width:56px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.evd .m{font-size:13px;font-weight:600;color:var(--muted)}
.evd .d{font-size:36px;line-height:1;font-weight:700}
.evb{flex:1;min-width:0}
.evb h3{margin:0 0 2px;font-size:24px;font-weight:600}
.evm{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:14px}
.evm span{display:inline-flex;align-items:center;gap:5px}
.evm a{color:inherit}
.tag{font-size:13px;font-weight:600}
.res{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:700;color:#fff;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:18px}
.res.W{background:var(--ok)}.res.L{background:var(--bad)}.res.T{background:#6B7A84}
.sh{font-size:26px;font-weight:600;margin:24px 0 10px}
/* plays */
.plays{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:start}
.stagegrid{display:grid;grid-template-columns:minmax(0,500px) minmax(300px,1fr);gap:20px;align-items:start}
.stage{min-width:0}
.courtcol .court{max-width:none}
.ctlcol .cap,.ctlcol .actions{max-width:none}
.ctlcol .steps{margin-top:0}
@media(min-width:981px){.courtcol{position:sticky;top:64px}}
@media(max-width:980px){.stagegrid{grid-template-columns:minmax(0,1fr)}.courtcol .court{max-width:560px}}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{text-align:left;padding:11px 12px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:600}
.pitem.on{border-color:var(--accent);box-shadow:inset 5px 0 0 var(--accent)}
.pitem small{display:block;color:var(--muted);font-weight:400}
.court{width:100%;max-width:560px;display:block;border-radius:10px;border:2px solid var(--ink);background:var(--floor);touch-action:none}
.court.view{touch-action:auto}
.stage .pname{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:28px;font-weight:600;border:1.5px solid var(--ink);border-radius:8px;background:#fff;width:100%;max-width:560px;padding:6px 12px}
.actions{max-width:560px;margin:12px 0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px}
.abtns{display:flex;flex-wrap:wrap;gap:8px}
.abtn{display:inline-flex;align-items:center;gap:8px;background:#2B3947;color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600}
.th .abtn{color:#fff}
.abtn.on{background:var(--accent);box-shadow:0 0 0 3px #F2B100}
.abtn:disabled{opacity:.4;cursor:not-allowed}
.stage h2{margin:0;font-size:32px;font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.sb{min-width:44px;height:40px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px;font-weight:600}
.sb.on{background:var(--ink);color:#fff}
.cap{max-width:560px;min-height:54px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(19,34,43,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:18px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mhead h3{margin:0;font-size:26px;font-weight:600}
.err{color:var(--bad);font-size:14px;margin-bottom:8px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600}
.chip .pn{margin-right:6px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.entry{padding:14px;margin-bottom:6px}
.entry-h{font-size:28px;font-weight:600;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.entry-s{font-family:'Barlow',system-ui,sans-serif;font-size:14px;font-weight:400;color:var(--muted)}
.ebtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.eb{padding:14px 8px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;font-weight:600;cursor:pointer;font-size:16px}
.eb:active{transform:scale(.97)}
.eb.made{background:#E4F3EC;border-color:var(--ok);color:#12513A}
.eb.miss{background:#F6E9E7;border-color:var(--bad);color:#7E2018}
.pad{margin-top:12px}
.banner{background:#FFF3C4;border-bottom:1px solid #E7CF70;padding:10px 16px}
.banner-in{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center}
.upd{padding:16px;margin-bottom:6px}
.upd-i{display:flex;gap:8px;padding:10px 0;border-top:1px solid #E3E8EB}
.savebar{position:sticky;bottom:10px;z-index:8;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#13222B;color:#fff;border-radius:12px;padding:10px 14px;margin-top:14px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.savebar .btn{background:#fff;color:#13222B}
.savebar .btn.pri{background:#F2B100;border-color:#F2B100;color:#13222B}
.pfilter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.pf{padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:14px}
.pf.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sb.dragging{opacity:.45;transform:scale(.94)}
.sb.wide{padding:0 12px;font-size:17px}
.courtcol .court.full{max-width:430px}
.courtcol.tall{position:static}
.pfilter.dragging .pf:not(.on){border-style:dashed}
.pf.drop{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.06)}
.pitem{display:flex;gap:8px;align-items:center}
.grip{flex:none;cursor:grab;touch-action:none;user-select:none;color:var(--muted);font-weight:700;letter-spacing:-2px;padding:6px 4px;margin:-6px 0 -6px -6px;border-radius:6px}
.grip:hover{background:#EEF1F3;color:var(--ink)}
.pitem.dragging{opacity:.45}
.pitem.over-b{box-shadow:0 5px 0 var(--accent)}
.pitem.over-t{box-shadow:0 -5px 0 var(--accent)}
.sb.over-l{box-shadow:-5px 0 0 var(--accent)}
.sb.over-r{box-shadow:5px 0 0 var(--accent)}
.coachsteps .sb{cursor:grab}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#F2B100;margin-left:2px}
@media(max-width:760px){
 .seg button{padding:8px 12px}
 .hdr h1{font-size:36px}
 .plays{grid-template-columns:minmax(0,1fr)}
 .plist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
 .pitem{white-space:nowrap}
 .pitem.over-b{box-shadow:5px 0 0 var(--accent)}
 .pitem.over-t{box-shadow:-5px 0 0 var(--accent)}
 .row2{grid-template-columns:1fr}
 .ev{padding:12px;gap:10px}
}
